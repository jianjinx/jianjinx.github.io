<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>渊底回响 · ECHOES OF THE ABYSS</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0908; --panel:#12100dcc; --line:#3a3226; --gold:#c9a227;
    --gold-l:#e8c96a; --ink:#e8e0d0; --dim:#8a8070; --red:#c0392b;
    --teal:#4dd0c4;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;
    font-family:"Noto Serif SC",serif;color:var(--ink);user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
    padding:10px 14px;background:linear-gradient(to bottom,#0d0b09e6,#0d0b0900);
    pointer-events:none;flex-wrap:wrap;z-index:5}
  #hud .title-mini{font-family:Cinzel,serif;font-weight:800;font-size:15px;letter-spacing:3px;color:var(--gold)}
  .bar{position:relative;height:14px;background:#000;border:1px solid var(--line);width:140px}
  .bar>i{position:absolute;inset:1px;transform-origin:left;transition:transform .25s ease;display:block}
  .bar.hp>i{background:linear-gradient(#a83a2e,#7e241b)}
  .bar.xp>i{background:linear-gradient(#d4af37,#9a7a1a)}
  .bar.en>i{background:linear-gradient(#4dd0c4,#1a7a72)}
  .bar span{position:absolute;inset:0;font-size:10px;line-height:14px;text-align:center;
    color:#f5efe0;letter-spacing:1px;font-weight:600}
  .stat{font-size:13px;color:var(--dim);letter-spacing:1px}
  .stat b{color:var(--ink);font-weight:600}
  .stat .g{color:var(--gold-l)}
  #depthTag{font-family:Cinzel,serif;color:var(--gold-l);font-size:14px;letter-spacing:2px}
  #threatTxt{font-size:11px;color:#b06a5a;letter-spacing:1px}
  .spacer{flex:1}
  #hud .btn{pointer-events:auto}
  .btn{cursor:pointer;background:transparent;border:1px solid var(--line);color:var(--ink);
    font-family:"Noto Serif SC",serif;font-size:13px;padding:6px 14px;letter-spacing:2px;
    transition:all .18s;position:relative;touch-action:manipulation}
  .btn:hover{border-color:var(--gold);color:var(--gold-l);background:#c9a22712}
  .btn.solid{border-color:var(--gold);color:#0a0908;background:var(--gold);font-weight:700}
  .btn.solid:hover{background:var(--gold-l)}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.pulse{animation:btnPulse 1.2s infinite}
  @keyframes btnPulse{0%,100%{box-shadow:0 0 0 0 #c9a22755}50%{box-shadow:0 0 14px 2px #c9a22755}}
  #log{position:absolute;left:14px;bottom:96px;width:300px;max-height:150px;overflow:hidden;
    font-size:12px;line-height:1.7;padding:8px 12px;background:var(--panel);
    border:1px solid var(--line);backdrop-filter:blur(4px);pointer-events:none;z-index:5}
  #log p{opacity:.55;transition:opacity .3s}
  #log p:last-child{opacity:1}
  #log .good{color:#b8c98a}#log .bad{color:#d9705f}#log .gold{color:var(--gold-l)}
  #log .sys{color:var(--dim);font-style:italic}
  #bossBar{position:absolute;top:52px;left:50%;transform:translateX(-50%);z-index:6;
    width:min(560px,86vw);display:none;pointer-events:none;text-align:center;
    transition:opacity .3s}
  #bossBar.show{display:block}
  #bossBar .bbName{font-family:Cinzel,serif;letter-spacing:4px;color:#e8c96a;font-size:15px;
    text-shadow:0 0 10px #000,0 0 20px #c0392b88;margin-bottom:4px;font-weight:800}
  #bossBar .bbTrack{height:13px;background:#0a0908;border:1px solid #6a2525;position:relative;
    box-shadow:0 0 12px #c0392b44}
  #bossBar .bbFill{position:absolute;inset:1px;background:linear-gradient(#c0392b,#7e241b);
    transform-origin:left;transition:transform .18s}
  #bossBar .bbTxt{font-size:10px;color:#d9705f;letter-spacing:2px;margin-top:3px}
  #skillbar{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:7;
    display:flex;gap:8px;align-items:flex-end}
  .skill{position:relative;width:54px;height:54px;background:#12100dd9;border:1px solid var(--line);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    transition:border-color .15s, transform .15s;touch-action:none}
  #skillbar .skill:hover{border-color:var(--gold);transform:translateY(-3px)}
  .skill svg{width:26px;height:26px;stroke:var(--gold-l);fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .skill .key{position:absolute;top:2px;left:4px;font-size:10px;color:var(--dim);font-family:Cinzel,serif}
  .skill .cost{position:absolute;bottom:2px;right:4px;font-size:10px;color:var(--teal);font-weight:700}
  .skill .cdOv{position:absolute;inset:0;background:#050403c9;display:none;
    align-items:center;justify-content:center;font-family:Cinzel,serif;font-size:22px;
    color:#d9705f;font-weight:800}
  .skill.cd .cdOv{display:flex}
  .skill.poor svg{stroke:#5a7a76}
  .skill.poor .cost{color:#2a5a55}
  .skill.locked{opacity:.4}
  .skill.locked .lockTxt{position:absolute;bottom:3px;left:0;right:0;text-align:center;
    font-size:9px;color:var(--dim);letter-spacing:1px}
  .skill.aiming{border-color:var(--teal);box-shadow:0 0 12px #4dd0c455;transform:translateY(-3px)}
  .skill.dodge svg{stroke:var(--teal)}
  .skill.dodge.cd .cdOv{color:#4dd0c4}
  .skill.dropOk{border-color:var(--teal)!important;box-shadow:0 0 16px #4dd0c477;
    transform:translateY(-4px)}
  .skill::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 10px);left:50%;
    transform:translateX(-50%);white-space:nowrap;background:#0d0b09f0;border:1px solid var(--line);
    color:var(--ink);font-size:11px;letter-spacing:1px;padding:6px 10px;pointer-events:none;
    opacity:0;transition:opacity .15s;z-index:9;line-height:1.6}
  .skill:hover::after{opacity:1}
  .skill.fusionSlot{border-color:var(--gold);width:58px;height:58px;background:#171208;
    animation:fusionPulse 1.4s infinite}
  @keyframes fusionPulse{0%,100%{box-shadow:0 0 4px 0 #c9a22733}50%{box-shadow:0 0 18px 3px #c9a22766}}
  .fGrid{display:grid;grid-template-columns:14px 14px;grid-template-rows:14px 14px;gap:2px;pointer-events:none}
  .fGrid svg{width:14px;height:14px;stroke-width:2.2}
  .fGrid svg:nth-child(even){stroke:var(--teal)}
  .skill.fusionSlot .tier{position:absolute;top:1px;right:4px;font-size:11px;
    color:var(--gold-l);font-family:Cinzel,serif;font-weight:800}
  .dragGhost{position:fixed;z-index:60;pointer-events:none;width:52px;height:52px;
    display:flex;align-items:center;justify-content:center;background:#12100dee;
    border:1px solid var(--gold-l);transform:translate(-50%,-50%) scale(1.15);
    box-shadow:0 0 18px #c9a22766}
  .dragGhost svg{width:26px;height:26px;stroke:var(--gold-l);fill:none;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .dragGhost.fused{border-color:var(--teal);box-shadow:0 0 18px #4dd0c477}
  .dragGhost.fused svg{position:absolute}
  .dragGhost.fused svg:first-child{left:5px;top:5px}
  .dragGhost.fused svg:last-child{right:5px;bottom:5px;width:19px;height:19px;stroke:var(--teal)}
  #pad{position:absolute;right:16px;bottom:96px;z-index:6;display:none;
    grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,50px);gap:6px}
  #pad button{background:#12100db8;border:1px solid var(--line);color:var(--ink);
    font-size:18px;cursor:pointer;touch-action:none}
  #pad button:active{border-color:var(--gold);color:var(--gold-l)}
  #pad button.dg{color:var(--teal);font-size:13px}
  #potionPad{position:absolute;right:190px;bottom:16px;z-index:6;display:none}
  #overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 40%,#0d0b09cc 0%,#050403f2 75%);
    opacity:0;pointer-events:none;transition:opacity .5s}
  #overlay.show{opacity:1;pointer-events:auto}
  .panel{text-align:center;max-width:680px;padding:26px 22px;width:92%;max-height:92vh;overflow-y:auto}
  .panel h1{font-family:Cinzel,serif;font-weight:800;font-size:clamp(34px,7vw,60px);
    letter-spacing:12px;color:var(--ink);text-indent:12px;line-height:1.15}
  .panel h1 em{display:block;font-style:normal;font-size:.34em;letter-spacing:8px;
    color:var(--gold);margin-top:10px;font-weight:600}
  .panel .rule{width:120px;height:1px;margin:22px auto;background:var(--gold);
    box-shadow:0 1px 0 #000;position:relative}
  .panel .sub{color:var(--dim);font-size:14px;letter-spacing:3px;line-height:2.1}
  .panel .keys{color:var(--dim);font-size:12px;letter-spacing:2px;line-height:2.1;margin-top:6px}
  .panel .keys b{color:var(--gold-l)}
  .panel .keys i{color:var(--teal);font-style:normal}
  .stats-row{display:flex;justify-content:center;gap:30px;margin:20px 0;flex-wrap:wrap}
  .stats-row div b{display:block;font-family:Cinzel,serif;font-size:28px;color:var(--gold-l)}
  .stats-row div span{font-size:12px;color:var(--dim);letter-spacing:2px}
  .best{font-size:12px;color:var(--dim);letter-spacing:2px;margin-top:14px}
  .best b{color:var(--gold-l)}
  .cards{display:flex;gap:14px;justify-content:center;margin:24px 0 10px;flex-wrap:wrap}
  .card{width:160px;padding:18px 12px 16px;background:#100e0b;border:1px solid var(--line);
    cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:10%;right:10%;height:1px;
    background:var(--gold);opacity:.4;transition:opacity .22s}
  .card:hover{transform:translateY(-6px);border-color:var(--gold);background:#171310;
    box-shadow:0 14px 34px -8px #000, 0 0 0 1px #c9a22733}
  .card:hover::before{opacity:1}
  .card svg{width:30px;height:30px;margin-bottom:8px;stroke:var(--gold-l);fill:none;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .card h3{font-size:14px;letter-spacing:3px;color:var(--ink);margin-bottom:6px}
  .card .lvTag{display:inline-block;font-size:10px;letter-spacing:1px;color:var(--teal);
    border:1px solid #2a5a55;padding:2px 8px;margin-bottom:8px}
  .card .lvTag.new{color:var(--gold-l);border-color:#5a4a1a}
  .card p{font-size:12px;color:var(--dim);line-height:1.7;min-height:40px}
  .lv-title{font-family:Cinzel,serif;color:var(--gold);letter-spacing:6px;font-size:14px}
  .lv-num{font-family:Cinzel,serif;font-size:42px;color:var(--ink);font-weight:800;margin:6px 0 2px}
  .shopGold{font-size:14px;letter-spacing:2px;color:var(--dim)}
  .shopGold b{color:var(--gold-l);font-family:Cinzel,serif;font-size:17px}
  .shopList{display:flex;flex-direction:column;gap:8px;margin:14px 0;max-height:44vh;
    overflow-y:auto;padding:0 4px}
  .shopRow{display:flex;align-items:center;gap:12px;background:#100e0b;border:1px solid var(--line);
    padding:9px 12px;text-align:left}
  .shopRow.sold{opacity:.4}
  .shopIco{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center}
  .shopIco svg{width:26px;height:26px;stroke:var(--gold-l);fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .shopInfo{flex:1;min-width:0}
  .shopInfo b{display:block;font-size:14px;letter-spacing:2px}
  .shopInfo span{font-size:11px;color:var(--dim);line-height:1.5;display:block}
  .shopRow .btn{flex:none;min-width:88px}
  .shopBtns{display:flex;gap:12px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  #toast{position:absolute;top:74px;left:50%;transform:translateX(-50%);z-index:8;
    font-size:13px;letter-spacing:2px;color:var(--gold-l);background:#0d0b09d9;
    border:1px solid var(--line);padding:7px 18px;opacity:0;transition:opacity .3s;
    pointer-events:none;max-width:90vw;text-align:center}
  #muteBtn{position:absolute;top:10px;right:12px;z-index:7;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;padding:0}
  #muteBtn svg{width:16px;height:16px;stroke:var(--dim);fill:none;stroke-width:1.8;stroke-linecap:round}
  #aimTip{position:absolute;bottom:88px;left:50%;transform:translateX(-50%);z-index:8;display:none;
    font-size:12px;letter-spacing:2px;color:var(--teal);background:#0d0b09d9;
    border:1px solid #2a5a55;padding:6px 16px;pointer-events:none}
  #startBtn{font-size:16px;padding:12px 42px;letter-spacing:6px}
  #castTip{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:8;
    display:none;text-align:center;pointer-events:none}
  #castTip .cn{font-size:clamp(22px,4vw,34px);letter-spacing:8px;color:#fff;
    text-shadow:0 0 18px #e8c96a,0 0 40px #ff7a2a;font-weight:700}
  #castTip .en{font-size:12px;letter-spacing:4px;color:var(--gold-l);margin-top:6px}
  @media (pointer:coarse){
    #pad{display:grid}
    #potionPad{display:block;right:10px;bottom:8px;padding:10px 12px;font-size:12px}
    .skill::after{display:none!important}
  }
  @media (max-width:820px){
    #skillbar{left:8px;right:172px;bottom:8px;transform:none;flex-wrap:wrap;
      gap:5px;align-content:flex-end;justify-content:flex-start;max-width:calc(100vw - 190px)}
    .skill{width:44px;height:44px}
    .skill.fusionSlot{width:50px;height:50px}
    .fGrid{grid-template-columns:12px 12px;grid-template-rows:12px 12px}
    .fGrid svg{width:12px;height:12px}
    #pad{right:10px;bottom:64px;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:5px}
    #pad button{font-size:16px}
    #log{left:8px;top:118px;bottom:auto;width:180px;font-size:10px;max-height:96px}
    .bar{width:100px}
    #hud{gap:8px;padding:8px 10px}
    #aimTip{bottom:auto;top:64px}
    #threatTxt{font-size:10px}
    #bossBar{top:88px}
  }
  @media (max-width:520px){ #threatTxt{display:none} }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud">
  <span class="title-mini">渊底回响</span>
  <span id="depthTag">第 1 层</span>
  <span id="threatTxt"></span>
  <div class="bar hp"><i id="hpBar"></i><span id="hpTxt"></span></div>
  <div class="bar en"><i id="enBar"></i><span id="enTxt"></span></div>
  <div class="bar xp"><i id="xpBar"></i><span id="xpTxt"></span></div>
  <span class="stat">攻 <b id="atkTxt">4</b></span>
  <span class="stat">防 <b id="defTxt">0</b></span>
  <span class="stat g">◈ <b id="goldTxt">0</b></span>
  <span class="stat">Lv <b id="lvTxt">1</b></span>
  <span class="spacer"></span>
  <button class="btn" id="potionBtn">药剂 ×<span id="potTxt">0</span>（Q）</button>
  <button class="btn" id="mapBtn">地图（M）</button>
  <button class="btn" id="trainBtn" style="display:none">增幅（C）</button>
  <button class="btn" id="exitTrainBtn" style="display:none">离开训练（T）</button>
  <button class="btn" id="shopBtn" style="display:none">神秘商人（B）</button>
  <button class="btn" id="stairsBtn" style="display:none">深入下层（E）</button>
</div>
<button class="btn" id="muteBtn" title="声音开关">
  <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="muteWave" d="M16 9c1.5 1.5 1.5 4.5 0 6"/></svg>
</button>
<div id="bossBar">
  <div class="bbName"></div>
  <div class="bbTrack"><div class="bbFill"></div></div>
  <div class="bbTxt"></div>
</div>
<div id="log"></div>
<div id="toast"></div>
<div id="aimTip">瞄准中：移动光标 / 点击施放 · ESC 取消</div>
<div id="castTip"><div class="cn"></div><div class="en"></div></div>
<div id="skillbar"></div>
<div id="pad">
  <span></span><button data-d="0,-1">▲</button><span></span>
  <button data-d="-1,0">◀</button><button data-dodge class="dg">⚡闪避</button><button data-d="1,0">▶</button>
  <span></span><button data-d="0,1">▼</button><span></span>
</div>
<button class="btn" id="potionPad">◈ 药剂 ×<span id="potTxt2">0</span></button>
<div id="overlay"><div class="panel" id="panelBox"></div></div>
<script>
'use strict';
/* ================================================================
   渊底回响 ECHOES OF THE ABYSS v7.1 —— 冰岩之歌 · 训练场
   10 技能 / 冰冻·岩笋 / 47 组融合特效 / 训练场（全技能+增幅任选）
   ================================================================ */
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[ri(0,a.length-1)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const cheb=(ax,ay,bx,by)=>Math.max(Math.abs(ax-bx),Math.abs(ay-by));
const hash2=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=(h^(h>>13))*1274126177|0;return ((h^(h>>16))>>>0)/4294967295;};
const MAP_W=48, MAP_H=34, MAX_DEPTH=10;
const WALL=0, FLOOR=1, STAIRS=2;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const LM=document.createElement('canvas'), lmCtx=LM.getContext('2d');
let TS=34, DPR=1, VW=0, VH=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=window.innerWidth; VH=window.innerHeight;
  cv.width=VW*DPR; cv.height=VH*DPR;
  LM.width=cv.width; LM.height=cv.height;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  TS=VW<640?28:34;
}
window.addEventListener('resize',resize); resize();
/* ---------- 音效 ---------- */
let AC=null, muted=false;
function initAudio(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } }
function tone(f0,f1,dur,type,vol,delay=0){
  if(!AC||muted)return;
  const t=AC.currentTime+delay, o=AC.createOscillator(), g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+dur+.02);
}
function noise(dur,vol){
  if(!AC||muted)return;
  const n=AC.sampleRate*dur, buf=AC.createBuffer(1,n,AC.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(), g=AC.createGain();
  s.buffer=buf; g.gain.value=vol; s.connect(g); g.connect(AC.destination); s.start();
}
const sfx={
  swing:()=>{tone(300,120,.09,'square',.05);},
  hit:()=>{noise(.1,.12);tone(160,60,.1,'square',.06);},
  hurt:()=>{tone(180,70,.22,'sawtooth',.09);noise(.14,.1);},
  coin:()=>{tone(900,900,.06,'sine',.06);tone(1350,1350,.09,'sine',.06,.06);},
  potion:()=>{tone(400,800,.18,'sine',.07);tone(600,1200,.2,'sine',.05,.08);},
  stairs:()=>{tone(220,55,.6,'sine',.1);tone(110,40,.7,'triangle',.07,.05);},
  levelup:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,f,.16,'triangle',.07,i*.09));},
  die:()=>{tone(300,40,1.1,'sawtooth',.1);noise(.5,.08);},
  boss:()=>{tone(90,30,1.4,'sawtooth',.13);noise(.6,.1);},
  summon:()=>{tone(120,340,.5,'sawtooth',.1);noise(.35,.09);tone(240,80,.4,'square',.06,.1);},
  crit:()=>{noise(.12,.14);tone(500,150,.13,'square',.08);},

function fusionName(parts){
  const cnt={};
  for(const i of parts)cnt[SKILLS[i].id]=(cnt[SKILLS[i].id]||0)+1;
  const ids=Object.keys(cnt).sort();
  let base;
  if(ids.length===1)base=PAIR_NAMES[ids[0]+'+'+ids[0]];
  else if(ids.length===2)base=PAIR_NAMES[[ids[0],ids[1]].sort().join('+')]
    ||SKILLS[parts[0]].name+'·'+SKILLS[parts[parts.length-1]].name;
  else base=PAIR_NAMES[[ids[0],ids[ids.length-1]].sort().join('+')]||'混沌回响';
  if(cnt.shield&&ids.length>1)base='护佑·'+base;
  return base+(TIER_ROMAN[parts.length]||'');
}

/* ================================================================
   地牢生成
   ================================================================ */
function genLevel(){
  const g=G;
  g.map=[]; g.explored=[]; g.visible=[];
  for(let y=0;y<MAP_H;y++){
    g.map.push(new Array(MAP_W).fill(WALL));
    g.explored.push(new Array(MAP_W).fill(false));
    g.visible.push(new Array(MAP_W).fill(false));
  }
  g.monsters=[]; g.items=[]; particles=[]; floaters=[]; projectiles=[]; rings=[];
  bolts=[]; motes=[]; effects=[]; scorches=[]; aim=null; casting=null;
  document.getElementById('aimTip').style.display='none';
  document.getElementById('castTip').style.display='none';
  if(g.training){ genTrainingFloor(); return; }
  if(g.depth===MAX_DEPTH){ genBossFloor(); return; }
  const rooms=[];
  for(let i=0;i<100 && rooms.length<10;i++){
    const w=ri(4,9), h=ri(3,7);
    const x=ri(1,MAP_W-w-2), y=ri(1,MAP_H-h-2);
    const r={x,y,w,h,cx:x+(w>>1),cy:y+(h>>1)};
    if(rooms.some(o=>x<o.x+o.w+1&&x+w+1>o.x&&y<o.y+o.h+1&&y+h+1>o.y))continue;
    rooms.push(r);
    for(let yy=y;yy<y+h;yy++)for(let xx=x;xx<x+w;xx++)g.map[yy][xx]=FLOOR;
  }
  g.rooms=rooms;
  rooms.sort((a,b)=>a.cx-b.cx);
  for(let i=1;i<rooms.length;i++){
    let a=rooms[i-1], b=rooms[i];
    let x=a.cx, y=a.cy;
    if(Math.random()<.5){ while(x!==b.cx){x+=Math.sign(b.cx-x);g.map[y][x]=FLOOR;} while(y!==b.cy){y+=Math.sign(b.cy-y);g.map[y][x]=FLOOR;} }
    else{ while(y!==b.cy){y+=Math.sign(b.cy-y);g.map[y][x]=FLOOR;} while(x!==b.cx){x+=Math.sign(b.cx-x);g.map[y][x]=FLOOR;} }
  }
  const start=rooms[0];
  g.player.x=start.cx; g.player.y=start.cy; g.player.rx=start.cx; g.player.ry=start.cy;
  g.player.dashTrail=[];
  let far=rooms[0], fd=-1;
  for(const r of rooms){const d=dist2(r.cx,r.cy,start.cx,start.cy);if(d>fd){fd=d;far=r;}}
  g.stairs={x:far.cx,y:far.cy};
  g.map[far.cy][far.cx]=STAIRS;
  let eliteName=null;
  if(g.depth===3||g.depth===5||g.depth===7){
    const key=g.depth===3?'golem':'stalker';
    let er=null,ed=-1;
    for(const r of rooms){
      if(r===start)continue;
      const d=dist2(r.cx,r.cy,start.cx,start.cy);
      if(d>ed&&g.map[r.cy][r.cx]===FLOOR){ed=d;er=r;}
    }
    if(er&&!g.monsters.some(m=>m.x===er.cx&&m.y===er.cy)){
      spawnMob(key,er.cx,er.cy,g.depth);
      eliteName=MOBS[key].name;
    }
  }
  const pool=Object.keys(MOBS).filter(k=>!MOBS[k].boss&&!MOBS[k].elite&&!MOBS[k].dummy&&MOBS[k].minD<=g.depth);
  const n=Math.min(20,6+g.depth+Math.floor(g.depth/2));
  for(let i=0;i<n;i++){
    const r=pick(rooms.slice(1).length?rooms.slice(1):rooms);
    const x=ri(r.x,r.x+r.w-1), y=ri(r.y,r.y+r.h-1);
    if(g.map[y][x]!==FLOOR)continue;
    if(dist2(x,y,g.player.x,g.player.y)<36)continue;
    if(g.monsters.some(m=>m.x===x&&m.y===y))continue;
    spawnMob(pick(pool),x,y,g.depth);
  }
  if(g.depth>=4){
    const extra=Math.floor(g.depth/3);
    for(let i=0;i<extra;i++){
      const r=pick(rooms.slice(1).length?rooms.slice(1):rooms);
      const x=ri(r.x,r.x+r.w-1), y=ri(r.y,r.y+r.h-1);
      if(g.map[y][x]!==FLOOR)continue;
      if(dist2(x,y,g.player.x,g.player.y)<36)continue;
      const strong=pool.filter(k=>MOBS[k].minD>=Math.max(2,g.depth-2));
      if(strong.length)spawnMob(pick(strong),x,y,g.depth);
    }
  }
  const nIt=ri(4,6);
  for(let i=0;i<nIt;i++){
    const r=pick(rooms), x=ri(r.x,r.x+r.w-1), y=ri(r.y,r.y+r.h-1);
    if(g.map[y][x]!==FLOOR)continue;
    if(g.items.some(it=>it.x===x&&it.y===y))continue;
    const roll=Math.random();
    let kind='gold';
    if(roll<.38)kind='gold'; else if(roll<.58)kind='potion';
    else if(roll<.70)kind='sword'; else if(roll<.80)kind='armor';
    else if(roll<.92)kind='heart'; else kind='chest';
    g.items.push(makeItem(kind,x,y));
  }
  computeFOV();
  calcThreat();
  genShop();
  g.banner={main:`第 ${g.depth} 层`,
            sub:eliteName?`小头目「${eliteName}」潜伏于此 · 敌影 ${g.threat.count} 只`
                         :`敌影 ${g.threat.count} 只 · 怪物力量 +${g.threat.pct}%`,
            life:1};
  if(eliteName)addLog(`这一层的空气格外沉重——小头目「${eliteName}」镇守着去路。`,'bad');
}

function calcThreat(){

  const pool=Object.keys(MOBS).filter(k=>!MOBS[k].boss&&!MOBS[k].elite&&!MOBS[k].dummy&&MOBS[k].minD<=g.depth);
  const avg=pool.reduce((s,k)=>
    s+(1+Math.max(0,g.depth-MOBS[k].minD)*.18)*(1+(g.depth-1)*.12),0)/pool.length;
  g.threat={count:g.monsters.length,pct:Math.round((avg-1)*100)};
}

/* ---------- 视野 ---------- */
function computeFOV(){
  const g=G, p=g.player, R=p.sight;
  for(let y=0;y<MAP_H;y++)g.visible[y].fill(false);
  g.visible[p.y][p.x]=true; g.explored[p.y][p.x]=true;
  for(let a=0;a<360;a+=1){
    const rad=a*Math.PI/180, dx=Math.cos(rad), dy=Math.sin(rad);
    let px=p.x+.5, py=p.y+.5;
    for(let r=0;r<=R;r+=.3){
      const tx=Math.floor(px+dx*r), ty=Math.floor(py+dy*r);
      if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H)break;
      g.visible[ty][tx]=true; g.explored[ty][tx]=true;
      if(g.map[ty][tx]===WALL)break;
    }
  }
}
function losClear(x0,y0,x1,y1){
  let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1, err=dx-dy;
  let x=x0,y=y0;
  while(!(x===x1&&y===y1)){
    const e2=2*err;
    if(e2>-dy){err-=dy;x+=sx;}
    if(e2<dx){err+=dx;y+=sy;}
    if(x===x1&&y===y1)break;
    if(G.map[y][x]===WALL)return false;
  }
  return true;
}

function monsterAt(x,y){return G.monsters.find(m=>m.alive&&m.x===x&&m.y===y);}
function tryMove(dx,dy){
  if(state!=='play'||casting)return;
  const p=G.player, nx=p.x+dx, ny=p.y+dy;
  if(dx)p.dir=Math.sign(dx);
  if(dx||dy)p.lastDir=[dx,dy];
  if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H)return;
  if(G.map[ny][nx]===WALL)return;
  const m=monsterAt(nx,ny);
  if(m){ attackMonster(m); endTurn(); return; }
  p.x=nx; p.y=ny;
  for(let i=G.items.length-1;i>=0;i--){
    const it=G.items[i];
    if(it.x===nx&&it.y===ny){ G.items.splice(i,1); pickup(it); }
  }
  checkStairsBtn();
  endTurn();
}
function makeAtk(base,def,critC){
  let dmg=base+ri(-1,2), crit=false;
  if(Math.random()<critC){dmg=Math.round(dmg*1.6);crit=true;}
  dmg=Math.max(1,dmg-def);
  return {dmg,crit};
}
function attackMonster(m){
  const p=G.player;
  p.lunge={dx:m.x-p.x,dy:m.y-p.y,t:1};
  const {dmg,crit}=makeAtk(p.atk,m.def,p.crit);
  const capped=dmgCap(m,dmg);
  m.hp-=capped; m.flash=1; m.hpShow=1;
  floatText(m.x+.5,m.y-.1,'-'+capped,crit?'#ffd766':'#ffffff');
  burst(m.x+.5,m.y+.5,crit?'#ffd766':'#b03a2e',crit?14:8);
  shake=crit?7:4;
  crit?sfx.crit():sfx.hit();
  p.energy=clamp(p.energy+1+p.warlust,0,p.maxEnergy);
  if(capped<dmg)addLog(`深渊之力护住了${m.name}（单次伤害上限）。`);
  if(crit)addLog(`会心一击！对${m.name}造成 ${capped} 点伤害。`,'good');
  else addLog(`你击中${m.name}，造成 ${capped} 点伤害。`);
  if(m.hp<=0)killMonster(m);
}
function dmgCap(m,dmg){
  if(m.boss)return Math.min(dmg,Math.ceil(m.maxhp*.15));
  if(m.elite)return Math.min(dmg,Math.ceil(m.maxhp*.22));
  return dmg;
}
function killMonster(m){
  m.alive=false;
  /* 训练假人：击碎后自动重组 */
  if(m.dummy){
    addLog('训练假人被击碎了，正在重组……','sys');
    burst(m.x+.5,m.y+.5,'#8a6a3a',18,{spd:3,g:2});
    sfx.die();
    const px=m.x, py=m.y;
    setTimeout(()=>{
      if(G&&G.training&&G.map[py][px]===FLOOR){
        spawnMob('dummy',px,py,1);
        addLog('训练假人已重组。','sys');
      }
    },1200);
    return;
  }
  G.kills++;
  burst(m.x+.5,m.y+.5,'#7e241b',16,{spd:3});
  burst(m.x+.5,m.y+.5,'#3a332b',10,{spd:1.5});
  const p=G.player;
  const gold=Math.round(m.gold*p.goldBoost);
  p.gold+=gold; G.goldEarned+=gold;
  p.energy=clamp(p.energy+2,0,p.maxEnergy);
  if(p.lifesteal&&p.hp<p.maxhp){
    p.hp=Math.min(p.maxhp,p.hp+p.lifesteal);
    floatText(p.x+.5,p.y-.5,'+'+p.lifesteal,'#7a9a4a');
  }
  floatText(m.x+.5,m.y-.6,'+'+gold+' ◈','#e8c96a');
  addLog(`${m.name}倒下了。拾得 ${gold} 枚金币。`,'gold');
  sfx.die();
  const r=Math.random();
  if(r<.16)G.items.push(makeItem('potion',m.x,m.y));
  else if(r<.28)G.items.push(makeItem('heart',m.x,m.y));
  else if(r<.36)G.items.push(makeItem('gold',m.x,m.y));
  if(m.elite){
    G.items.push(makeItem('chest',m.x,m.y));
    addLog(`小头目「${m.name}」被斩落，留下了宝箱！`,'gold');
    flashScreen=.35; shake=Math.max(shake,10);
  }
  if(m.boss){ setTimeout(win,900); }
  gainXP(m.xp);
}
function gainXP(n){
  const p=G.player;
  p.xp+=n;
  while(p.xp>=p.xpNext){ p.xp-=p.xpNext; p.lvl++; p.xpNext=10+p.lvl*8; openLevelUp(); }
}
function damagePlayer(dmg,m){
  const p=G.player;

  }

  addLog(`${m.name}击中你，造成 ${dmg} 点伤害。`,'bad');

function endTurn(){
  const g=G; g.turns++; turnCount++;
  const p=g.player;
  p.energy=clamp(p.energy+1,0,p.maxEnergy);
  for(let i=0;i<p.skillCd.length;i++)if(p.skillCd[i]>0)p.skillCd[i]--;
  if(p.dodgeCd>0)p.dodgeCd--;
  if(p.shieldTurns>0){
    p.shieldTurns--;
    if(p.shieldTurns<=0&&p.shield>0){p.shield=0;addLog('渊盾消散了。');}
    else if(p.shield>0&&p.shieldTurns===3&&!g.training)toast('渊盾将在 3 回合后消散');
  }
  /* 训练场：无限回响 + 零冷却 */
  if(g.training){
    p.energy=p.maxEnergy;
    for(let i=0;i<p.skillCd.length;i++)p.skillCd[i]=0;
    p.dodgeCd=0;
  }
  for(const m of g.monsters){
    if(!m.alive)continue;
    if(state!=='play')break;
    if(m.flash>0)m.flash-=.5;
    /* 冰冻：跳过行动，解冻时受解冻伤害 */
    if(m.frozen>0){
      m.frozen--;
      if(m.frozen<=0){
        const dmg=Math.max(1,Math.round(p.atk*1.5*p.skillBoost));
        m.hp-=dmg; m.flash=1; m.hpShow=1.5;
        floatText(m.x+.5,m.y-.1,'解冻 -'+dmg,'#aef0ff');
        burst(m.x+.5,m.y+.5,'#aef0ff',12,{spd:3,g:.5});
        sfx.thaw();
        addLog(`${m.name}解冻，受到 ${dmg} 点解冻伤害。`);
        if(m.hp<=0){killMonster(m);continue;}
      }else continue;
    }
    if(m.slowT>0)m.slowT--;
    if(m.slow||m.slowT>0){ m.slowCnt^=1; if(m.slowCnt)continue; }
    monsterAct(m);
  }
  if(state!=='play')return;
  computeFOV();
  if(autoPath && g.monsters.some(m=>m.alive&&!m.dummy&&m.visible[m.y]&&m.visible[m.y][m.x]))autoPath=null;
  updateHUD();
}
function monsterAct(m){
  if(m.dummy)return;
  if(m.frozen>0)return;
  const p=G.player, d2=dist2(m.x,m.y,p.x,p.y), d=Math.sqrt(d2);
  const sees=d<=7.5 && losClear(m.x,m.y,p.x,p.y);
  if(m.boss){
    if(m.charging){
      m.charging=0;
      shake=14; flashScreen=.5; sfx.boss();
      burst(m.x+.5,m.y+.5,'#c0392b',40,{spd:6});
      burst(m.x+.5,m.y+.5,'#e8c96a',20,{spd:4});
      addLog('深渊之主释放了怒焰！','bad');
      if(dist2(m.x,m.y,p.x,p.y)<=6.5)damagePlayer(14+G.depth,m);
      return;
    }
    if(!m.enraged&&m.hp<m.maxhp*.4){
      m.enraged=1; m.atk=Math.round(m.atk*1.4);
      addLog('深渊之主暴怒了！黑暗沸腾翻涌！','bad');
      shake=12; flashScreen=.4; sfx.boss();
      burst(m.x+.5,m.y+.5,'#c0392b',30,{spd:5});
      floatText(m.x+.5,m.y-1.2,'暴怒!','#ff5040');
      return;
    }
    if(turnCount%6===2){
      const adds=G.monsters.filter(o=>o.alive&&!o.boss).length;
      if(adds<5){ bossSummon(m); return; }
    }
    const chargeGap=m.enraged?3:5;
    if(turnCount%chargeGap===chargeGap-1 && d<=7){
      m.charging=1;
      addLog('深渊之主在凝聚黑暗之力——闪避或拉开距离！','bad');
      return;
    }
  }
  if(!sees){
    if(Math.random()<.35){ const dirs=[[1,0],[-1,0],[0,1],[0,-1]],dd=pick(dirs);
      stepMob(m,m.x+dd[0],m.y+dd[1]); }
    return;
  }
  if(d<=1){
    if(m.windupCap&&!m.windup&&Math.random()<.4){
      m.windup=1;
      floatText(m.x+.5,m.y-.7,'蓄力!','#e07a3a');
      if(!windupHintShown){windupHintShown=true;
        addLog(`${m.name}举起了武器——按 空格 闪避这一击！`,'bad');}
      return;
    }
    let mult=1;
    if(m.windup){m.windup=0;mult=1.8;shake=Math.max(shake,5);}
    m.lunge={dx:p.x-m.x,dy:p.y-m.y,t:1}; m.dir=Math.sign(p.x-m.x)||m.dir;
    const {dmg}=makeAtk(Math.round(m.atk*mult),p.def,0);
    if(mult>1)floatText(p.x+.5,p.y-.7,'重击!','#e07a3a');
    damagePlayer(dmg,m);
    return;
  }
  if(m.ranged && d<=5 && d>=2){
    m.lunge={dx:(p.x-m.x)*.3,dy:(p.y-m.y)*.3,t:1};
    const {dmg}=makeAtk(m.atk,p.def,0);
    projectiles.push({x0:m.x+.5,y0:m.y+.5,x1:p.x+.5,y1:p.y+.5,p:0,color:'#e07a3a'});
    damagePlayer(dmg,m);
    return;
  }
  let dx=Math.sign(p.x-m.x), dy=Math.sign(p.y-m.y);
  if(m.erratic && Math.random()<.4){ dx=pick([1,-1,0]); dy=dx?0:pick([1,-1]); }
  if(!stepMob(m,m.x+dx,m.y+dy)){
    if(dx&&!stepMob(m,m.x+dx,m.y)) stepMob(m,m.x,m.y+dy);
    else if(dy) stepMob(m,m.x+dx,m.y);
  }
  if((m.fast||(m.boss&&m.enraged)) && d>1){
    const dx2=Math.sign(p.x-m.x),dy2=Math.sign(p.y-m.y);
    stepMob(m,m.x+dx2,m.y+dy2);
  }
}
function stepMob(m,nx,ny){
  if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H)return false;
  if(G.map[ny][nx]===WALL)return false;
  if(G.monsters.some(o=>o.alive&&o!==m&&o.x===nx&&o.y===ny))return false;
  if(G.player.x===nx&&G.player.y===ny)return false;
  if(nx!==m.x)m.dir=Math.sign(nx-m.x)||m.dir;
  m.x=nx; m.y=ny; return true;
}
/* 冰冻辅助 */
function freezeMob(m,turns){
  if(!m.alive)return;
  if(m.boss||m.elite)turns=Math.min(turns,1);
  m.frozen=Math.max(m.frozen,turns);
  m.windup=0; m.charging=0;
  floatText(m.x+.5,m.y-.6,'冻结!','#aef0ff');
  burst(m.x+.5,m.y+.5,'#aef0ff',8,{spd:2,g:0});
  sfx.freeze();
}

function tryDodge(){
  if(state!=='play'||casting)return;
  const p=G.player;
  if(p.dodgeCd>0){toast(`闪避冷却中（${p.dodgeCd} 回合）`);sfx.skillFail();return;}
  const [dx,dy]=p.lastDir;
  if(dx)p.dir=Math.sign(dx);
  let px=p.x, py=p.y, moved=false;
  for(let s=0;s<2;s++){
    const nx=px+dx, ny=py+dy;
    if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H)break;
    if(G.map[ny][nx]===WALL)break;
    px=nx; py=ny; moved=true;
    p.dashTrail.push({x:nx,y:ny,life:1});
    if(dx||dy)p.dir=Math.sign(dx)||p.dir;
    burst(nx+.5,ny+.5,'#4dd0c4',4,{spd:1,g:0});
  }
  if(!moved){toast('无路可闪');sfx.skillFail();return;}
  p.x=px; p.y=py;
  p.dodgeCd=p.dodgeCdMax;
  floatText(px+.5,py-.4,'闪避!','#4dd0c4');
  sfx.dodge();
  for(let i=G.items.length-1;i>=0;i--){
    const it=G.items[i];
    if(it.x===px&&it.y===py){ G.items.splice(i,1); pickup(it); }
  }
  computeFOV(); checkStairsBtn(); updateHUD();
}

function skillHit(m,mult,boost=1,noDef=false){
  const p=G.player;
  let dmg=p.atk*mult*p.skillBoost*boost;
  const crit=Math.random()<p.crit;
  if(crit)dmg*=1.6;
  dmg=Math.max(1,Math.round(dmg+ri(-1,1)-(noDef?0:m.def)));
  dmg=dmgCap(m,dmg);
  m.hp-=dmg; m.flash=1; m.hpShow=1.5;
  floatText(m.x+.5,m.y-.1,'-'+dmg,crit?'#ffd766':'#ffffff');
  burst(m.x+.5,m.y+.5,crit?'#ffd766':'#b03a2e',crit?14:8);
  if(m.hp<=0)killMonster(m);
  return dmg;
}
function paySkill(i){

}

function castChainInner(boost=1){
  const p=G.player;
  const vis=G.monsters.filter(m=>m.alive&&G.visible[m.y]&&G.visible[m.y][m.x]);
  if(!vis.length){toast('视野内没有敌人');sfx.skillFail();return false;}
  let chain=[], cur=null, cd2=1e9;
  for(const m of vis){const d=dist2(m.x,m.y,p.x,p.y);if(d<cd2){cd2=d;cur=m;}}
  chain.push(cur);
  while(chain.length<4){
    let best=null,bd=1e9;
    for(const m of vis){
      if(chain.includes(m))continue;
      const d=dist2(m.x,m.y,cur.x,cur.y);
      if(d<bd&&d<=16){bd=d;best=m;}
    }
    if(!best)break;
    chain.push(best);cur=best;
  }
  sfx.zap(); shake=Math.max(shake,5); flashScreen=Math.max(flashScreen,.15);
  addBolt(p.x+.5,p.y+.2,chain[0].x+.5,chain[0].y+.2);
  for(let k=1;k<chain.length;k++)
    addBolt(chain[k-1].x+.5,chain[k-1].y+.2,chain[k].x+.5,chain[k].y+.2);
  chain.forEach((m,k)=>skillHit(m,1.25*Math.pow(.85,k),boost));
  addLog(`雷光链！电流贯穿 ${chain.length} 个敌人。`,'good');
  return true;
}

function addBolt(x0,y0,x1,y1,col){
  const pts=[{x:x0,y:y0}], segs=5;
  for(let s=1;s<segs;s++){
    const t=s/segs;
    pts.push({x:lerp(x0,x1,t)+rnd(-.18,.18),y:lerp(y0,y1,t)+rnd(-.18,.18)});
  }
  pts.push({x:x1,y:y1});
  bolts.push({pts,life:1,col:col||null});
}
function useSkill(i){
  if(state!=='play'||casting)return;
  const sk=SKILLS[i], p=G.player;
  if(skillLocked(i)){toast(`等级 ${sk.lv} 解锁「${sk.name}」（或从商人处购买秘传）`);sfx.skillFail();return;}
  if(aim&&aim.i===i){cancelAim();return;}
  if(p.skillCd[i]>0){toast(`「${sk.name}」冷却中（${p.skillCd[i]} 回合）`);sfx.skillFail();return;}
  if(p.energy<sk.cost){toast('回响之力不足');sfx.skillFail();return;}
  if(sk.targeted){
    let best=null,bd=1e9;
    for(const m of G.monsters){
      if(!m.alive||!G.visible[m.y]||!G.visible[m.y][m.x])continue;
      const d=dist2(m.x,m.y,p.x,p.y);
      if(d<bd){bd=d;best=m;}
    }
    aim={i,x:best?best.x:p.x,y:best?best.y:p.y};
    autoPath=null;
    document.getElementById('aimTip').style.display='';
    updateSkillbar();
    return;
  }
  let ok=false;
  const id=sk.id;
  if(id==='whirl')ok=castWhirlInner(1);
  else if(id==='chain')ok=castChainInner(1);
  else if(id==='shield')ok=castShieldInner(1);
  else if(id==='nova')ok=castNovaInner(1);
  else if(id==='shock')ok=castShockInner(1);
  else if(id==='reap')ok=castReapInner(1);
  if(ok){
    paySkill(i);
    computeFOV(); checkStairsBtn(); updateHUD();
  }
}

function fusionCost(parts){return parts.reduce((s,i)=>s+SKILLS[i].cost,0)-(parts.length-1);}
function countElems(parts){
  const c={};
  for(const i of parts)c[SKILLS[i].id]=(c[SKILLS[i].id]||0)+1;
  return c;
}
function firstFreeSlot(){
  const p=G.player;

}
function tryFuse(a,b){
  const p=G.player;

  if(p.skillCd[a]>0||p.skillCd[b]>0){toast('融合组件冷却中');sfx.skillFail();return;}
  const slot=firstFreeSlot();
  if(slot<0){toast('融合槽已满（F/G/H 释放腾出槽位）');sfx.skillFail();return;}
  p.fusions[slot]={parts:[a,b]};

  burst(p.x+.5,p.y+.5,'#4dd0c4',10,{spd:2,g:-1});
  burst(p.x+.5,p.y+.5,'#e8c96a',10,{spd:2,g:-1});
  toast(`融合「${fusionName(p.fusions[slot].parts)}」Lv2 · ${'FGH'[slot]} 释放 / 继续拖入组件升阶`);
  addLog(`回响共鸣：「${SKILLS[a].name}」+「${SKILLS[b].name}」→「${fusionName(p.fusions[slot].parts)}」（Lv2）。`,'gold');

function addToSlot(slot,i){

function selfMergeSlot(slot){

function mergeSlots(sa,sb){
  const p=G.player;
  const fa=p.fusions[sa], fb=p.fusions[sb];
  if(!fa||!fb||sa===sb)return;
  const total=fa.parts.length+fb.parts.length;
  if(total>p.maxFusionTier){

  burst(p.x+.5,p.y+.5,'#e8c96a',18,{spd:3,g:-1});

function castFromSlot(slot,tx,ty){
  if(state!=='play'||casting)return;
  const p=G.player;
  const f=p.fusions[slot];
  if(!f){toast('该融合槽是空的');sfx.skillFail();return;}
  const parts=f.parts, tier=parts.length;
  if(parts.some(i=>skillLocked(i))){toast('组件中有技能未解锁');sfx.skillFail();return;}
  if(parts.some(i=>p.skillCd[i]>0)){toast('融合组件冷却中');sfx.skillFail();return;}
  const cost=fusionCost(parts);
  if(p.energy<cost){toast('回响之力不足');sfx.skillFail();return;}
  const needsTarget=parts.some(i=>SKILLS[i].targeted);
  let fireTile=null;
  if(needsTarget){
    if(tx!==undefined){
      if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H||!G.explored[ty][tx]
         ||dist2(tx,ty,p.x,p.y)>49){
        toast('超出射程或未探索');sfx.skillFail();return;
      }
      fireTile={x:tx,y:ty};
    }else{
      fireTile=bestFireTarget()||{x:clamp(p.x+p.lastDir[0]*4,1,MAP_W-2),
                                   y:clamp(p.y+p.lastDir[1]*4,1,MAP_H-2)};
    }
  }
  p.energy-=cost;
  for(const i of [...new Set(parts)])p.skillCd[i]=SKILLS[i].cd;
  cancelAim();
  casting={parts:[...parts],slot,fireTile,t:0,dur:.8,
           name:fusionName(parts),recipe:countElems(parts)};
  sfx.castCharge();
  document.getElementById('castTip').style.display='';
  document.getElementById('castTip').querySelector('.cn').textContent=casting.name;
  document.getElementById('castTip').querySelector('.en').textContent='FUSION · LEVEL '+tier;
}
function bestFireTarget(){
  let best=null,bs=-1;
  const cands=G.monsters.filter(m=>m.alive&&G.visible[m.y]&&G.visible[m.y][m.x]);
  for(const m of cands){
    let cnt=0;
    for(const o of G.monsters)if(o.alive&&cheb(o.x,o.y,m.x,m.y)<=1)cnt++;
    if(cnt>bs){bs=cnt;best={x:m.x,y:m.y};}
  }
  return best;
}

function drawBladeArc(x,y,a,R,alpha,main,cA='232,201,106',cB='255,252,225'){
  ctx.save();ctx.translate(x,y);ctx.rotate(a);
  const len=1.15, w=main?TS*.34:TS*.2;
  const g=ctx.createLinearGradient(R*.25,0,R,0);
  g.addColorStop(0,`rgba(${cA},0)`);
  g.addColorStop(.55,`rgba(${cA},${alpha*.75})`);
  g.addColorStop(1,`rgba(${cB},${alpha})`);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.arc(0,0,R,0,len);
  ctx.arc(0,0,Math.max(2,R-w),len,0,true);
  ctx.closePath();ctx.fill();
  if(main){
    ctx.strokeStyle=`rgba(${cB},${alpha})`;ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(0,0,R-w*.5,.06,len-.06);ctx.stroke();
    ctx.fillStyle=`rgba(255,255,255,${alpha})`;
    ctx.beginPath();ctx.arc(R*Math.cos(len*.5),R*Math.sin(len*.5),3,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function drawZigY(wx,y0,y1){
  ctx.beginPath();
  ctx.moveTo(wx*TS,y0*TS);
  const segs=7;
  for(let k=1;k<=segs;k++){
    const yy=lerp(y0,y1,k/segs);
    const xx=wx+(k===segs?0:rnd(-.24,.24));
    ctx.lineTo(xx*TS,yy*TS);
  }
  ctx.stroke();
}
function drawSpike(px,py,h,w,alpha){
  ctx.save();
  const x=px*TS, y=py*TS;
  const g=ctx.createLinearGradient(x,y,x,y-h*TS);
  g.addColorStop(0,`rgba(84,68,48,${alpha})`);
  g.addColorStop(.7,`rgba(150,124,86,${alpha})`);
  g.addColorStop(1,`rgba(216,196,156,${alpha})`);
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x-w*TS/2,y);
  ctx.lineTo(x,y-h*TS);
  ctx.lineTo(x+w*TS/2,y);
  ctx.closePath();ctx.fill();
  ctx.strokeStyle=`rgba(56,44,32,${alpha})`;ctx.lineWidth=1;
  ctx.stroke();
  ctx.restore();
}

function fxJudgement(tx,ty,tier,power){
  const spots=[{x:tx,y:ty}];
  const cands=G.monsters.filter(m=>m.alive&&G.visible[m.y]&&G.visible[m.y][m.x]);
  cands.sort((a,b)=>dist2(a.x,a.y,tx,ty)-dist2(b.x,b.y,tx,ty));
  for(const m of cands){
    if(spots.length>=2+tier)break;
    if(!spots.some(s=>s.x===m.x&&s.y===m.y))spots.push({x:m.x,y:m.y});
  }
  let guard=0;
  while(spots.length<2+tier&&guard++<30){
    const a=rnd(0,Math.PI*2), d=rnd(1,2.2);
    const x=Math.round(tx+Math.cos(a)*d), y=Math.round(ty+Math.sin(a)*d);
    if(x<0||y<0||x>=MAP_W||y>=MAP_H||G.map[y][x]===WALL)continue;
    if(spots.some(s=>s.x===x&&s.y===y))continue;
    spots.push({x,y});
  }
  spots.forEach((s,k)=>{
    effects.push({type:'pillar',x:s.x+.5,y:s.y+.5,t:-k*.13,dur:.85,power,done:false});
  });
  effects.push({type:'elegrid',x:tx+.5,y:ty+.5,t:-(spots.length)*.13,dur:2.6,
    r:2+tier*.3,power,tick:0});
  flashColor={color:'#7ad0ff',a:.5};
  shake=12; sfx.zap(); sfx.nova();
}

function routeSpecial(R){
  const ids=Object.keys(R).filter(k=>ELEM[k]&&k!=='shield');
  const only=a=>ids.length===1&&ids[0]===a;
  const pair=(a,b)=>ids.length===2&&ids.includes(a)&&ids.includes(b);
  if(only('whirl'))return 'dualspin';
  if(only('chain'))return 'judgement';
  if(only('nova'))return 'annihilate';
  if(only('frag'))return 'carpet';
  if(only('shock'))return 'gravity';
  if(only('ice'))return 'blizzard';
  if(only('rock'))return 'earthvein';
  if(pair('whirl','fire'))return 'tornado';
  if(pair('fire','chain'))return 'plasma';
  if(pair('reap','nova'))return 'dawn';
  if(pair('whirl','chain'))return 'thunderblades';
  if(pair('whirl','frag'))return 'shrapspin';
  if(pair('whirl','shock'))return 'ripwave';
  if(pair('whirl','reap'))return 'reapvortex';
  if(pair('whirl','nova'))return 'echostorm';
  if(pair('fire','frag'))return 'bigbomb';
  if(pair('fire','shock'))return 'blastring';
  if(pair('fire','reap'))return 'soulshear';
  if(pair('fire','nova'))return 'novafire';
  if(pair('chain','frag'))return 'arcmine';
  if(pair('chain','shock'))return 'pulsewave';
  if(pair('chain','reap'))return 'hookbolt';
  if(pair('chain','nova'))return 'wrath';
  if(pair('frag','shock'))return 'seismic';
  if(pair('frag','reap'))return 'shred';
  if(pair('frag','nova'))return 'kaleido';
  if(pair('shock','reap'))return 'soundreap';
  if(pair('shock','nova'))return 'quakenova';
  if(pair('whirl','ice'))return 'icewind';
  if(pair('fire','ice'))return 'steam';
  if(pair('frag','ice'))return 'shatter';
  if(pair('chain','ice'))return 'frostbolt';
  if(pair('shock','ice'))return 'polar';
  if(pair('reap','ice'))return 'soulfrost';
  if(pair('nova','ice'))return 'icenova';
  if(pair('whirl','rock'))return 'rockdance';
  if(pair('fire','rock'))return 'magma';
  if(pair('frag','rock'))return 'rockburst';
  if(pair('chain','rock'))return 'stoneforest';
  if(pair('shock','rock'))return 'fault';
  if(pair('reap','rock'))return 'impale';
  if(pair('nova','rock'))return 'continental';
  if(pair('ice','rock'))return 'froststone';
  return null;
}

    addLog('弹片风暴在目标处四散飞射！','good');
  }
  if(R.shock){
    effects.push({type:'shockwave',x:cx,y:cy,t:0,dur:.6,color:'#e0e0ff',maxR:2.5+R.shock});
    const range=2+R.shock;
    for(const m of G.monsters){
      if(!m.alive||cheb(m.x,m.y,p.x,p.y)>range)continue;
      skillHit(m,power,true);
      if(m.alive){
        const kx=Math.sign(m.x-p.x)||1,ky=Math.sign(m.y-p.y)||1;
        for(let s=0;s<2;s++)stepMob(m,m.x+kx,m.y+ky)||stepMob(m,m.x+kx,m.y)||stepMob(m,m.x,m.y+ky);
      }
    }
    addLog('冲击波把敌人掀飞了！','good');
  }
  if(R.reap){
    const rv=vis();
    for(let k=0;k<rv.length;k++){
      const m=rv[k];
      effects.push({type:'slash',x:m.x+.5,y:m.y+.5,t:-k*.06,dur:.45,color:'#ff3a4a'});
      if(m.hp/m.maxhp<.4&&!m.boss&&!m.elite&&!m.dummy){
        floatText(m.x+.5,m.y-.8,'收割!','#ff3a4a');
        m.hp=0;m.flash=1;m.hpShow=1.5;
        if(m.hp<=0)killMonster(m);
      }else skillHit(m,power,true);
    }
    addLog('死亡镰刀横扫全场！','gold');
  }
  if(catalyst)applyAegis(tier);
  }
  addLog(`释放 ${tier} 级融合技「${c.name}」！`,'gold');
  computeFOV(); checkStairsBtn(); updateHUD();
}
function cancelAim(){
  aim=null;
  document.getElementById('aimTip').style.display='none';
  updateSkillbar();
}
function aimValid(){
  if(!aim)return false;
  const sk=SKILLS[aim.i], p=G.player;
  if(aim.x<0||aim.y<0||aim.x>=MAP_W||aim.y>=MAP_H)return false;
  if(!G.explored[aim.y][aim.x])return false;
  if(dist2(aim.x,aim.y,p.x,p.y)>sk.range*sk.range)return false;
  return true;
}
function fireFromAim(){
  const tx=aim.x,ty=aim.y,i=aim.i;
  const id=SKILLS[i].id;
  paySkill(i); sfx.dash();
  if(id==='fire'){castFireInner(tx,ty);addLog('你掷出了火球。');}
  else if(id==='ice'){castIceInner(tx,ty);addLog('你掷出了冰弹。');}
  else if(id==='rock'){castRockInner(tx,ty);addLog('你召唤了岩笋。');}
  else{castFragInner(tx,ty);addLog('你掷出了破片手雷。');}
  cancelAim(); updateHUD();
}

function pickup(it){
  const p=G.player;
  switch(it.kind){
    case 'gold': p.gold+=it.amount; G.goldEarned+=it.amount;
      floatText(it.x+.5,it.y,'+'+it.amount+' ◈','#e8c96a');
      burst(it.x+.5,it.y+.5,'#e8c96a',8,{spd:2,g:.5});
      addLog(`拾得 ${it.amount} 枚金币。`,'gold'); sfx.coin(); break;
    case 'potion': p.potions++;
      addLog('拾起一瓶猩红药剂。'); sfx.potion(); break;
    case 'sword': p.atk+=it.val;
      floatText(it.x+.5,it.y,'攻击 +'+it.val,'#e8e0d0');
      addLog(`拾起利刃，攻击 +${it.val}。`,'good'); sfx.coin(); break;
    case 'armor': p.def+=it.val;
      floatText(it.x+.5,it.y,'防御 +'+it.val,'#e8e0d0');
      addLog(`拾起护甲，防御 +${it.val}。`,'good'); sfx.coin(); break;
    case 'heart': p.maxhp+=5; p.hp+=5;
      floatText(it.x+.5,it.y,'生命上限 +5','#d9705f');
      addLog('吞下深渊之心，生命上限 +5。','good'); sfx.potion(); break;
    case 'chest':{
      burst(it.x+.5,it.y+.5,'#e8c96a',22,{spd:3,g:1});
      const gold=ri(30,50)+G.depth*10; p.gold+=gold; G.goldEarned+=gold;
      let msg=`打开宝箱：获得 ${gold} 枚金币`;
      const bonus=pick(['potion','heart','sword','armor']);
      if(bonus==='potion'){p.potions++;msg+='、药剂 ×1';}
      if(bonus==='heart'){p.maxhp+=5;p.hp+=5;msg+='、深渊之心';}
      if(bonus==='sword'){p.atk+=1;msg+='、利刃（攻击+1）';}
      if(bonus==='armor'){p.def+=1;msg+='、护甲（防御+1）';}
      addLog(msg+'。','gold'); sfx.levelup(); break;
    }
  }
  updateHUD();
}

const keyMap={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
  w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
let heldDir=null, holdTimer=0;
let autoPath=null, autoTimer=0;
document.addEventListener('keydown',e=>{
  if(state==='title'){startGame();return;}
  if(state==='levelup')return;
  if(state==='bless'){
    if(e.key==='Escape'||e.key==='c'||e.key==='C')closeBlessPicker();
    return;
  }
  if(state==='shop'){if(e.key==='Escape')closeShop(false);return;}
  if(casting)return;
  const k=e.key;
  if(k==='m'||k==='M'){
    if(G){G.showMap=!G.showMap;
      document.getElementById('mapBtn').textContent=G.showMap?'地图（M）':'地图·关';}
    return;
  }
  if((k==='c'||k==='C')&&G&&G.training){e.preventDefault();openBlessPicker();return;}
  if((k==='t'||k==='T')&&G&&G.training){e.preventDefault();exitTraining();return;}
  if(aim){
    if(keyMap[k]){e.preventDefault();
      aim.x=clamp(aim.x+keyMap[k][0],0,MAP_W-1);
      aim.y=clamp(aim.y+keyMap[k][1],0,MAP_H-1);
      return;}
    if(k==='Enter'){e.preventDefault();
      if(aimValid())fireFromAim();
      else{toast('超出射程或未探索');sfx.skillFail();}
      return;}
    if(k==='Escape'){cancelAim();return;}
  }
  if(keyMap[k]){e.preventDefault();
    cancelAim();
    if(!heldDir){tryMove(...keyMap[k]);}
    heldDir=keyMap[k]; holdTimer=0; autoPath=null; return;}
  if(k===' '||k==='Shift'){e.preventDefault();cancelAim();tryDodge();return;}
  if(k>='1'&&k<='9'){e.preventDefault();useSkill(+k-1);return;}
  if(k==='0'){e.preventDefault();useSkill(9);return;}
  if(k==='f'||k==='F'){e.preventDefault();castFromSlot(0);return;}
  if(k==='g'||k==='G'){e.preventDefault();castFromSlot(1);return;}
  if(k==='h'||k==='H'){e.preventDefault();castFromSlot(2);return;}
  if(k==='b'||k==='B'){e.preventDefault();openShop();return;}
  if(k==='e'||k==='E'||k==='Enter'){e.preventDefault(); tryDescend();}
  if(k==='q'||k==='Q')drinkPotion();
});
document.addEventListener('keyup',e=>{
  const d=keyMap[e.key];
  if(d&&heldDir&&d[0]===heldDir[0]&&d[1]===heldDir[1])heldDir=null;
});
window.addEventListener('blur',()=>heldDir=null);
window.addEventListener('contextmenu',e=>{
  if(aim){e.preventDefault();cancelAim();}
});

}

cv.addEventListener('pointerdown',e=>{
  if(state==='title'){startGame();return;}
  if(state!=='play'||casting)return;
  initAudio();
  const [gx,gy]=screenToTile(e.clientX,e.clientY);
  if(gx<0||gy<0||gx>=MAP_W||gy>=MAP_H)return;
  if(aim){
    aim.x=gx; aim.y=gy;
    if(aimValid())fireFromAim();
    else{toast('超出射程或未探索');sfx.skillFail();}
    return;
  }
  if(!G.explored[gy][gx])return;
  const p=G.player;
  if(Math.abs(gx-p.x)<=1&&Math.abs(gy-p.y)<=1){
    autoPath=null;
    tryMove(Math.sign(gx-p.x),Math.sign(gy-p.y)); return;
  }
  const blocked=(x,y)=>G.map[y][x]===WALL||G.monsters.some(m=>m.alive&&m.x===x&&m.y===y);
  const prev=new Map(), q=[[p.x,p.y]]; prev.set(p.x+','+p.y,null);
  let found=false;
  while(q.length){
    const [x,y]=q.shift();
    if(x===gx&&y===gy){found=true;break;}
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy,k=nx+','+ny;
      if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H||prev.has(k))continue;
      if(!G.explored[ny][nx])continue;
      if(blocked(nx,ny)&&!(nx===gx&&ny===gy))continue;
      prev.set(k,x+','+y); q.push([nx,ny]);
    }
  }
  if(!found)return;
  const path=[]; let cur=gx+','+gy;
  while(cur&&cur!==p.x+','+p.y){
    const [x,y]=cur.split(',').map(Number);
    path.unshift([x,y]);
    cur=prev.get(cur);
  }
  autoPath=path; autoTimer=0;
});

function floorTone(d,x,y){
  const h=hash2(x,y)*10-5;
  const warm=[62,55,45], cold=[46,46,50], blood=[56,44,42];
  const t1=clamp(d/5,0,1), t2=clamp((d-5)/5,0,1);
  let c=[0,1,2].map(i=>lerp(warm[i],cold[i],t1));
  c=[0,1,2].map(i=>lerp(c[i],blood[i],t2));
  return c.map(v=>clamp(v+h,0,255));
}

function renderLighting(ox,oy,sx,sy){
  const p=G.player;
  const flick=.88+.12*Math.sin(tNow*6.3)+.05*Math.sin(tNow*11.1);
  lmCtx.setTransform(DPR,0,0,DPR,0,0);
  lmCtx.globalCompositeOperation='source-over';
  lmCtx.clearRect(0,0,VW,VH);
  const darkA=clamp(.38+G.depth*.03,0,.7);
  lmCtx.fillStyle=G.depth>=8?`rgba(14,3,6,${darkA})`:`rgba(4,5,10,${darkA})`;
  lmCtx.fillRect(0,0,VW,VH);
  lmCtx.globalCompositeOperation='destination-out';
  const hole=(wx,wy,r,a)=>{
    if(r<=0||a<=0)return;
    const x=ox+sx+wx*TS, y=oy+sy+wy*TS;
    if(x<-r||y<-r||x>VW+r||y>VH+r)return;
    const g=lmCtx.createRadialGradient(x,y,r*.04,x,y,r);
    g.addColorStop(0,`rgba(0,0,0,${clamp(a,0,1)})`);
    g.addColorStop(.5,`rgba(0,0,0,${clamp(a*.6,0,1)})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    lmCtx.fillStyle=g;
    lmCtx.fillRect(x-r,y-r,r*2,r*2);
  };
  hole(p.rx+.5,p.ry+.5,p.sight*TS*.94,.9*flick);
  const st=G.stairs;
  if(st.x>=0&&G.visible[st.y]&&G.visible[st.y][st.x])
    hole(st.x+.5,st.y+.5,1.5*TS,.4+.15*Math.sin(tNow*2.4));
  for(const pr of projectiles){
    const x=lerp(pr.x0,pr.x1,pr.p), y=lerp(pr.y0,pr.y1,pr.p);
    hole(x,y,(pr.big?2.6:1.4)*TS,.7);
  }
  for(const b of bolts)
    for(const pt of b.pts)hole(pt.x,pt.y,1.1*TS,.45*b.life);
  for(const r of rings)hole(r.x,r.y,(r.r+.7)*TS,.35*r.life);
  if(casting)hole(p.x+.5,p.y+.5,TS*3.4,.85);
  for(const ef of effects){
    if(ef.type==='meteor'&&ef.t>0)hole(ef.tx,ef.ty,TS*2,.6);
    if(ef.type==='firepit')hole(ef.x,ef.y,ef.r*TS*1.6,.6*(1-ef.t/ef.dur));

            floatText(m.x+.5,m.y-.8,'断魂!','#ff3a4a');
            m.hp=0;m.flash=1;killMonster(m);
          }else skillHit(m,ef.power,true);
        }
      }
    }
    else if(ef.type==='quakenova'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr*.5;
      for(let k=0;k<3;k++){
        const R=Math.max(0,pr*1.15-k*.12)*ef.maxR*TS;
        if(R<2)continue;
        ctx.strokeStyle=k===0?`rgba(255,242,192,${.8*fade})`:`rgba(232,201,106,${.5*fade})`;
        ctx.lineWidth=(5-k)*(1-pr)+1;
        ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,R,0,Math.PI*2);ctx.stroke();
      }
      ctx.restore();
      shake=Math.max(shake,5*(1-pr));
      const R2=pr*1.15*ef.maxR;
      for(const m of G.monsters){
        if(!m.alive||ef.hit.has(m))continue;
        if(Math.hypot(m.x+.5-ef.x,m.y+.5-ef.y)<=R2){
          ef.hit.add(m);
          burst(m.x+.5,m.y+.5,'#e8c96a',8,{spd:3,g:.5});
          skillHit(m,ef.power*.75,true);
        }
      }
    }
    else if(ef.type==='runes'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr;
      const R=TS*1.3;
      ctx.translate(ef.x*TS,ef.y*TS);
      ctx.strokeStyle=`rgba(77,208,196,${.7*fade})`;ctx.lineWidth=2;
      for(const off of [0,Math.PI]){
        ctx.beginPath();
        for(let k=0;k<3;k++){
          const a=ef.t*2+off+k/3*Math.PI*2;
          const px=Math.cos(a)*R, py=Math.sin(a)*R;
          if(k===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();ctx.stroke();
      }
      for(let k=0;k<6;k++){
        const a=ef.t*3+k/6*Math.PI*2;
        const L=TS*(1.1+pr*.8);
        const g=ctx.createLinearGradient(Math.cos(a)*R*.5,Math.sin(a)*R*.5,Math.cos(a)*L,Math.sin(a)*L);
        g.addColorStop(0,'rgba(232,201,106,0)');
        g.addColorStop(1,`rgba(255,244,200,${.8*fade})`);
        ctx.strokeStyle=g;ctx.lineWidth=2.5;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a)*R*.5,Math.sin(a)*R*.5);
        ctx.lineTo(Math.cos(a)*L,Math.sin(a)*L);
        ctx.stroke();
      }
      ctx.restore();
    }
    else if(ef.type==='blizzard'){
      if(Math.random()<.95){
        const a=rnd(0,Math.PI*2), d=rnd(2,6.5);
        particles.push({x:ef.x+Math.cos(a)*d,y:ef.y+Math.sin(a)*d*.8,
          vx:-rnd(1,2.5),vy:rnd(-.3,.3),life:rnd(.6,1.2),maxLife:1.2,
          color:Math.random()<.6?'#aef0ff':'#ffffff',size:rnd(1.5,3),grav:0});
      }
      ef.tick+=1/60;
      if(ef.tick>.5){
        ef.tick=0;
        sfx.freeze();
        for(const m of G.monsters){
          if(!m.alive||!G.visible[m.y]||!G.visible[m.y][m.x])continue;
          if(!m.frozen)freezeMob(m,1);
          else m.frozen=Math.min(m.frozen+1,3);
          skillHit(m,ef.power*.25,true);
        }
        updateHUD();
      }
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr*.5;
      ctx.strokeStyle=`rgba(174,240,255,${.25*fade})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,6.5*TS*pr,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    else if(ef.type==='icewind'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const spin=ef.t*12, fade=1-pr*.6;
      for(let b=0;b<4;b++)
        drawBladeArc(ef.x*TS,ef.y*TS,spin+b*Math.PI/2,TS*1.6,fade,true,'174,240,255','240,252,255');
      ctx.restore();
      if(Math.random()<.7)
        particles.push({x:ef.x+rnd(-1,1),y:ef.y+rnd(-1,1),
          vx:rnd(-1,1),vy:rnd(-1,1),life:.4,maxLife:1,
          color:'#aef0ff',size:2,grav:0});
      ef.tick+=1/60;
      if(ef.tick>.45){
        ef.tick=0;
        for(const m of G.monsters){
          if(!m.alive||cheb(m.x,m.y,Math.floor(ef.x),Math.floor(ef.y))>2)continue;
          if(!m.frozen)freezeMob(m,2);
        }
      }
    }
    else if(ef.type==='steam'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr*.4;
      for(let k=0;k<8;k++){
        const ha=hash2(k*7,11)*Math.PI*2, hd=hash2(k*13,17)*ef.r;
        const px=ef.x+Math.cos(ha)*hd*pr*1.1, py=ef.y+Math.sin(ha)*hd*.7*pr*1.1;
        const rr=TS*(.25+pr*.35);
        const g=ctx.createRadialGradient(px*TS,py*TS,0,px*TS,py*TS,rr);
        g.addColorStop(0,`rgba(235,240,245,${.4*fade})`);
        g.addColorStop(1,'rgba(235,240,245,0)');
        ctx.fillStyle=g;
        ctx.beginPath();ctx.arc(px*TS,py*TS,rr,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
      if(Math.random()<.7)
        particles.push({x:ef.x+rnd(-1,1),y:ef.y+rnd(-.5,.5),
          vx:rnd(-.3,.3),vy:-rnd(.8,1.8),life:rnd(.5,1),maxLife:1,
          color:pick(['#e8f0f5','#cfe0ea']),size:rnd(2,4),grav:-.3});
      ef.tick+=1/60;
      if(ef.tick>.5){
        ef.tick=0;
        for(const m of G.monsters)
          if(m.alive&&cheb(m.x,m.y,Math.floor(ef.x),Math.floor(ef.y))<=ef.r)
            skillHit(m,ef.power*.3,true);
        updateHUD();
      }
    }
    else if(ef.type==='shatter'){
      if(!ef.done&&ef.t>=.5){
        ef.done=true;
        sfx.frag(); sfx.thaw(); shake=13;
        flashColor={color:'#aef0ff',a:.5};
        burst(ef.x,ef.y,'#aef0ff',26,{spd:5,g:1});
        rings.push({x:ef.x,y:ef.y,r:.2,max:2,color:'#aef0ff',life:1});
        for(let k=0;k<14;k++){
          const a=rnd(0,Math.PI*2), v=rnd(2,5);
          particles.push({x:ef.x,y:ef.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.5,
            life:rnd(.4,.8),maxLife:1,color:pick(['#aef0ff','#e8f8ff','#7ac8e8']),
            size:rnd(2,4),grav:2});
        }
        for(const m of G.monsters){
          if(!m.alive||cheb(m.x,m.y,Math.floor(ef.x),Math.floor(ef.y))>1)continue;
          if(m.frozen>0){
            m.frozen=0;
            floatText(m.x+.5,m.y-.8,'碎裂!','#aef0ff');
            skillHit(m,ef.power*1.3,true);
          }
        }
        updateHUD();
      }
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr*.5;
      const pul=.5+.5*Math.sin(ef.t*16);
      ctx.strokeStyle=`rgba(174,240,255,${.6*fade*pul})`;ctx.lineWidth=2;
      ctx.strokeRect(ef.x*TS-TS*.8,ef.y*TS-TS*.8,TS*1.6,TS*1.6);
      ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,TS*.5,0,Math.PI*2);ctx.stroke();
      ctx.restore();
    }
    else if(ef.type==='iceburst'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr;
      for(let k=0;k<6;k++){
        const a=k/6*Math.PI*2;
        drawSpike(ef.x+Math.cos(a)*.4,ef.y+Math.sin(a)*.3,.5*fade,.3,fade*.8);
      }
      ctx.restore();
    }
    else if(ef.type==='polar'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const R=pr*ef.maxR*TS, fade=1-pr*.5;
      ctx.strokeStyle=`rgba(174,240,255,${.8*fade})`;ctx.lineWidth=5*(1-pr)+2;
      ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,R,0,Math.PI*2);ctx.stroke();
      ctx.strokeStyle=`rgba(255,255,255,${.6*fade})`;ctx.lineWidth=1.5;
      ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,R*.9,0,Math.PI*2);ctx.stroke();
      for(let k=0;k<10;k++){
        const a=k/10*Math.PI*2+ef.t*2;
        drawSpike(ef.x+Math.cos(a)*pr*ef.maxR,ef.y+Math.sin(a)*pr*ef.maxR*.8,
          .35,.2,fade*.9);
      }
      ctx.restore();
      const R2=pr*ef.maxR;
      for(const m of G.monsters){
        if(!m.alive||ef.hit.has(m))continue;
        if(Math.hypot(m.x+.5-ef.x,m.y+.5-ef.y)<=R2){
          ef.hit.add(m);
          burst(m.x+.5,m.y+.5,'#aef0ff',8,{spd:3,g:.3});
          skillHit(m,ef.power*.85,true);
          if(m.alive)freezeMob(m,2);
        }
      }
    }
    else if(ef.type==='icenova'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr;
      for(let k=0;k<3;k++){
        const R=(.3+pr*(ef.maxR-k*.9))*TS;
        if(R<=0)continue;
        ctx.strokeStyle=k===1?`rgba(255,255,255,${.8*fade})`:`rgba(174,240,255,${.65*fade})`;
        ctx.lineWidth=(5-k)*(1-pr)+1;
        ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,R,0,Math.PI*2);ctx.stroke();
      }
      for(let k=0;k<8;k++){
        const a=k/8*Math.PI*2+ef.x;
        const d=pr*ef.maxR;
        drawSpike(ef.x+Math.cos(a)*d,ef.y+Math.sin(a)*d*.85,.6*(1-pr*.5),.25,fade);
      }
      ctx.restore();
      const R2=pr*ef.maxR;
      for(const m of G.monsters){
        if(!m.alive||ef.hit.has(m)||!G.visible[m.y]||!G.visible[m.y][m.x])continue;
        if(Math.hypot(m.x+.5-ef.x,m.y+.5-ef.y)<=R2){
          ef.hit.add(m);
          skillHit(m,ef.power*.95,true);
          if(m.alive)freezeMob(m,3);
        }
      }
    }
    else if(ef.type==='rockspike'){
      if(!ef.done&&ef.t>=.18){
        ef.done=true;
        sfx.rock(); shake=Math.max(shake,8);
        burst(ef.x,ef.y,'#8a6a3a',10,{spd:2,g:3});
        for(const m of G.monsters){
          if(!m.alive||cheb(m.x,m.y,Math.floor(ef.x),Math.floor(ef.y))>1)continue;
          if(ef.exec)execOrHit(m,ef.power,ef.thresh);
          else skillHit(m,ef.power,true);
        }
        updateHUD();
      }
      const e=1-Math.pow(1-clamp(ef.t/ef.dur,0,1),3);
      const fade=clamp(1-(ef.t-ef.dur*.6)/(ef.dur*.4),0,1);
      for(let k=0;k<4;k++){
        const ha=hash2(k*7,Math.floor(ef.x*3))*Math.PI*2;
        const d=hash2(k*13,Math.floor(ef.y*5))*.5;
        drawSpike(ef.x+Math.cos(ha)*d,ef.y+Math.sin(ha)*d*.7,
          (0.9+k*.35)*e*fade,.45,fade);
      }
    }
    else if(ef.type==='earthvein'){
      ef.tick+=1/60;
      if(ef.tick>.22){
        ef.tick=0;
        const a=rnd(0,Math.PI*2), d=Math.sqrt(Math.random())*ef.r;
        const px=ef.x+Math.cos(a)*d, py=ef.y+Math.sin(a)*d*.8;
        const tx2=Math.floor(px), ty2=Math.floor(py);
        if(tx2>=0&&ty2>=0&&tx2<MAP_W&&ty2<MAP_H&&G.map[ty2][tx2]!==WALL){
          effects.push({type:'rockspike',x:px,y:py,t:0,dur:.5,power:ef.power*.5});
          shake=Math.max(shake,5);
        }
      }
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr*.4;
      ctx.strokeStyle=`rgba(201,161,90,${.35*fade})`;ctx.lineWidth=2;
      for(let k=0;k<6;k++){
        const a=k/6*Math.PI*2+ef.x;
        ctx.beginPath();
        ctx.moveTo(ef.x*TS,ef.y*TS);
        let px=ef.x,py=ef.y;
        for(let s=1;s<=4;s++){
          px=ef.x+Math.cos(a)*ef.r*s/4+rnd(-.15,.15);
          py=ef.y+Math.sin(a)*ef.r*s/4*.8+rnd(-.15,.15);
          ctx.lineTo(px*TS,py*TS);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
    else if(ef.type==='rockdance'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const spin=ef.t*8, fade=1-pr*.4;
      for(let b=0;b<5;b++){
        const a=spin+b*Math.PI*2/5;
        const px=ef.x+Math.cos(a)*1.2, py=ef.y+Math.sin(a)*1.2*.8;
        ctx.save();ctx.translate(px*TS,py*TS);ctx.rotate(a+ef.t*4);
        ctx.fillStyle=`rgba(150,124,86,${.85*fade})`;
        ctx.strokeStyle=`rgba(84,68,48,${.8*fade})`;ctx.lineWidth=1.5;
        ctx.beginPath();
        ctx.moveTo(-6,-4);ctx.lineTo(2,-7);ctx.lineTo(7,-1);ctx.lineTo(3,6);ctx.lineTo(-5,3);
        ctx.closePath();ctx.fill();ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
      if(Math.random()<.6)
        particles.push({x:ef.x+rnd(-1,1),y:ef.y+rnd(-1,1),
          vx:rnd(-.5,.5),vy:-rnd(.3,1),life:.5,maxLife:1,
          color:'#8a6a3a',size:rnd(2,3),grav:.5});
      ef.tick+=1/60;
      if(ef.tick>.4){
        ef.tick=0;
        for(const m of G.monsters){
          if(!m.alive||cheb(m.x,m.y,Math.floor(ef.x),Math.floor(ef.y))>1)continue;
          skillHit(m,ef.power*.3,true);
          if(m.alive){
            const kx=Math.sign(m.x-Math.floor(ef.x))||1,ky=Math.sign(m.y-Math.floor(ef.y))||1;
            stepMob(m,m.x+kx,m.y+ky)||stepMob(m,m.x+kx,m.y);
          }
        }
        updateHUD();
      }
    }
    else if(ef.type==='magma'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr*.4;
      const H=2.6*Math.sin(clamp(ef.t/ef.dur,0,1)*Math.PI);
      for(let lv=0;lv<8;lv++){
        const h=lv/8;
        const yy=ef.y-h*H;
        const rr=(.35+(1-h)*.25)*TS;
        const fl=.6+.4*Math.random();
        ctx.fillStyle=`rgba(255,${(90+h*110)|0},30,${.55*fade*fl})`;
        ctx.beginPath();ctx.arc(ef.x*TS,yy*TS,rr*(1-h*.3),0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
      if(Math.random()<.85)
        particles.push({x:ef.x+rnd(-.3,.3),y:ef.y,
          vx:rnd(-1,1),vy:-rnd(2,4.5),life:rnd(.5,1),maxLife:1,
          color:pick(['#ff7a2a','#ffd24a','#c9a15a','#5a4430']),
          size:rnd(2,4),grav:2.5});
      ef.tick+=1/60;
      if(ef.tick>.45){
        ef.tick=0;
        for(const m of G.monsters)
          if(m.alive&&cheb(m.x,m.y,Math.floor(ef.x),Math.floor(ef.y))<=1)
            skillHit(m,ef.power*.35,true);
        updateHUD();
      }
    }
    else if(ef.type==='rockburst'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr;
      ctx.strokeStyle=`rgba(201,161,90,${.7*fade})`;ctx.lineWidth=6*(1-pr)+2;
      ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,(.3+pr*2.2)*TS,0,Math.PI*2);ctx.stroke();
      ctx.restore();
      const e=1-Math.pow(1-pr,2);
      for(let k=0;k<5;k++){
        const a=k/5*Math.PI*2+.5;
        drawSpike(ef.x+Math.cos(a)*e*.8,ef.y+Math.sin(a)*e*.7,.9*(1-pr*.5),.4,fade);
      }
    }
    else if(ef.type==='fault'){
      ef.tick+=1/60;
      if(ef.tick>.14){
        ef.tick=0;
        const seg=Math.floor(pr*ef.len);
        if(seg!==ef.lastSeg){
          ef.lastSeg=seg;
          const px=ef.x+ef.dx*(seg+.5), py=ef.y+ef.dy*(seg+.5);
          const tx2=Math.floor(px), ty2=Math.floor(py);
          if(tx2>=0&&ty2>=0&&tx2<MAP_W&&ty2<MAP_H&&G.map[ty2][tx2]!==WALL){
            effects.push({type:'rockspike',x:px,y:py,t:0,dur:.5,power:ef.power*.55});
            sfx.rock(); shake=Math.max(shake,7);
          }
        }
      }
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr*.4;
      ctx.strokeStyle=`rgba(201,161,90,${.5*fade})`;ctx.lineWidth=7;
      ctx.beginPath();
      ctx.moveTo(ef.x*TS,ef.y*TS);
      ctx.lineTo((ef.x+ef.dx*ef.len*pr)*TS,(ef.y+ef.dy*ef.len*pr)*TS);
      ctx.stroke();
      ctx.strokeStyle=`rgba(84,68,48,${.6*fade})`;ctx.lineWidth=2;
      ctx.stroke();
      ctx.restore();
    }
    else if(ef.type==='continental'){
      ef.tick+=1/60;
      if(ef.tick>.2){
        ef.tick=0;
        const cands=G.monsters.filter(m=>m.alive&&G.visible[m.y]&&G.visible[m.y][m.x]&&!ef.hit.has(m));
        if(cands.length){
          const m=pick(cands);
          ef.hit.add(m);
          effects.push({type:'rockspike',x:m.x+.5,y:m.y+.5,t:0,dur:.5,power:ef.power*.6});
          skillHit(m,ef.power*.5,true);
        }else{
          const a=rnd(0,Math.PI*2), d=rnd(1,5);
          const px=ef.x+Math.cos(a)*d, py=ef.y+Math.sin(a)*d*.8;
          if(px>=0&&py>=0&&px<MAP_W&&py<MAP_H&&G.map[Math.floor(py)][Math.floor(px)]!==WALL)
            effects.push({type:'rockspike',x:px,y:py,t:0,dur:.5,power:0});
        }
        sfx.rock(); shake=Math.max(shake,9);
        updateHUD();
      }
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr*.4;
      ctx.strokeStyle=`rgba(201,161,90,${.55*fade})`;ctx.lineWidth=9;
      ctx.beginPath();
      ctx.moveTo((ef.x-7)*TS,ef.y*TS);ctx.lineTo((ef.x+7)*TS,ef.y*TS);
      ctx.moveTo(ef.x*TS,(ef.y-5)*TS);ctx.lineTo(ef.x*TS,(ef.y+5)*TS);
      ctx.stroke();
      ctx.strokeStyle=`rgba(84,68,48,${.7*fade})`;ctx.lineWidth=3;
      ctx.stroke();
      ctx.restore();
    }
    else if(ef.type==='froststone'){
      ef.tick+=1/60;
      if(ef.tick>.25){
        ef.tick=0;
        const a=rnd(0,Math.PI*2), d=Math.sqrt(Math.random())*ef.r;
        const px=ef.x+Math.cos(a)*d, py=ef.y+Math.sin(a)*d*.8;
        if(px>=0&&py>=0&&px<MAP_W&&py<MAP_H&&G.map[Math.floor(py)][Math.floor(px)]!==WALL){
          effects.push({type:'rockspike',x:px,y:py,t:0,dur:.5,power:ef.power*.5});
          for(const m of G.monsters)
            if(m.alive&&!m.frozen&&m.x===Math.floor(px)&&m.y===Math.floor(py))
              freezeMob(m,2);
        }
      }
      ctx.save();ctx.globalCompositeOperation='lighter';
      const fade=1-pr*.4;
      const e=1-Math.pow(1-clamp(ef.t/.5,0,1),3);
      for(let k=0;k<5;k++){
        const a=k/5*Math.PI*2;
        drawSpike(ef.x+Math.cos(a)*.6,ef.y+Math.sin(a)*.5,1.2*e*fade,.35,fade);
      }
      ctx.strokeStyle=`rgba(174,240,255,${.5*fade})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,ef.r*.7*TS,0,Math.PI*2);ctx.stroke();
      ctx.restore();
      if(Math.random()<.5)
        particles.push({x:ef.x+rnd(-1,1),y:ef.y+rnd(-1,1),
          vx:rnd(-.3,.3),vy:-rnd(.5,1.5),life:.7,maxLife:1,
          color:'#aef0ff',size:rnd(1.5,3),grav:-.2});
    }
  }
}
function drawCasting(){
  const p=G.player, c=casting;
  const prog=c.t/c.dur;
  const cx=p.rx*TS+TS/2, cy=p.ry*TS+TS/2;
  const parts=c.parts;
  const colors=parts.map(i=>ELEM[SKILLS[i].id].color);
  ctx.save();
  const R1=TS*(1+prog*1.6), R2=TS*(.65+prog*1.1);
  ctx.globalCompositeOperation='lighter';
  for(let ring=0;ring<2;ring++){
    const R=ring?R2:R1, rot=tNow*(ring?-1.6:2.2);
    ctx.strokeStyle=colors[ring%colors.length];
    ctx.globalAlpha=.35+prog*.55;
    ctx.lineWidth=ring?1.5:2.5;

function drawMinimap(){

  const x=VW-w-12, y=60;

  ctx.strokeStyle='#3a3226';ctx.lineWidth=1;
  ctx.strokeRect(x-5,y-5,w+10,h+10);
  for(let yy=0;yy<MAP_H;yy++)for(let xx=0;xx<MAP_W;xx++){
    if(!G.explored[yy]||!G.explored[yy][xx])continue;
    const t=G.map[yy][xx];

    case 'armor':{
      ctx.fillStyle='#7a8288';
      ctx.beginPath();ctx.moveTo(0,-9*s);ctx.lineTo(7*s,-6*s);ctx.lineTo(6*s,5*s);
      ctx.lineTo(0,10*s);ctx.lineTo(-6*s,5*s);ctx.lineTo(-7*s,-6*s);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#4a5057';ctx.lineWidth=1.3*s;
      ctx.beginPath();ctx.moveTo(0,-9*s);ctx.lineTo(0,10*s);ctx.stroke();
      ctx.fillStyle='#c9a227';ctx.beginPath();ctx.arc(0,0,1.6*s,0,Math.PI*2);ctx.fill();
      break;}
    case 'heart':{
      const pul=1+Math.sin(t*4)*.06;
      ctx.scale(pul,pul);
      ctx.fillStyle='#a83a2e';
      ctx.beginPath();
      ctx.moveTo(0,9*s);
      ctx.bezierCurveTo(-11*s,0,-7*s,-9*s,0,-3.5*s);
      ctx.bezierCurveTo(7*s,-9*s,11*s,0,0,9*s);ctx.fill();
      ctx.fillStyle='#d9705f';
      ctx.beginPath();ctx.arc(-3*s,-3*s,2*s,0,Math.PI*2);ctx.fill();
      break;}
    case 'chest':{
      ctx.fillStyle='#6b4a2a';ctx.fillRect(-8*s,-2*s,16*s,9*s);
      ctx.fillStyle='#7d5834';
      ctx.beginPath();ctx.moveTo(-8*s,-2*s);
      ctx.quadraticCurveTo(0,-10*s,8*s,-2*s);ctx.fill();
      ctx.fillStyle='#c9a227';
      ctx.fillRect(-1.6*s,-3*s,3.2*s,5*s);
      ctx.fillStyle='#12100d';ctx.fillRect(-.7*s,-1.5*s,1.4*s,2.4*s);
      ctx.strokeStyle='#4a3320';ctx.lineWidth=1.2*s;
      ctx.strokeRect(-8*s,-2*s,16*s,9*s);
      break;}
  }
  ctx.restore();
}
/* ================================================================
   主循环
   ================================================================ */
function loop(ts){
  tNow=ts/1000;
  if(casting&&state==='play'){
    casting.t+=1/60;
    if(casting.t>=casting.dur){
      if(G.player.hp>0)fusionBurst();
      else{casting=null;document.getElementById('castTip').style.display='none';}
    }
  }
  if(heldDir&&state==='play'&&!aim&&!casting){
    holdTimer+=16;
    if(holdTimer>130){holdTimer=0;tryMove(...heldDir);}
  }
  if(autoPath&&state==='play'&&!aim&&!casting){
    autoTimer+=16;
    if(autoTimer>100){
      autoTimer=0;
      const nxt=autoPath[0], p=G.player;
      const dx=nxt[0]-p.x, dy=nxt[1]-p.y;
      if(Math.abs(dx)+Math.abs(dy)!==1){autoPath=null;}
      else{
        autoPath.shift();
        tryMove(dx,dy);
        if(G.monsters.some(m=>m.alive&&m.x===p.x+dx&&m.y===p.y+dy))autoPath=null;
        if(!autoPath.length)autoPath=null;
      }
    }
  }
  for(let i=bolts.length-1;i>=0;i--){bolts[i].life-=.012;if(bolts[i].life<=0)bolts.splice(i,1);}
  if(G&&(state==='play'||state==='title')){
    const p=G.player;
    if(!casting&&motes.length<40&&Math.random()<.4){
      if(Math.random()<.35){
        motes.push({x:p.x+.5+rnd(-.15,.15),y:p.y+.1,
          vx:rnd(-.06,.06),vy:-rnd(.4,.8),life:rnd(.5,1),max:1,size:rnd(1,2),ember:true});
      }else{
        const a=rnd(0,Math.PI*2), d=rnd(1,p.sight*.8);
        motes.push({x:p.x+.5+Math.cos(a)*d,y:p.y+.5+Math.sin(a)*d*.7,
          vx:rnd(-.1,.1),vy:rnd(-.25,-.05),life:rnd(2,4),max:4,size:rnd(.8,1.8),ember:false});
      }
    }
    for(let i=motes.length-1;i>=0;i--){
      const mo=motes[i];
      mo.x+=mo.vx*.016; mo.y+=mo.vy*.016; mo.life-=.016;
      if(mo.life<=0)motes.splice(i,1);
    }
  }
  draw();
  requestAnimationFrame(loop);
}
showTitle();
requestAnimationFrame(loop);
</script>
