function floorTone(d,x,y){
  const h=hash2(x,y)*10-5;
  const warm=[62,55,45], cold=[46,46,50], blood=[56,44,42];
  const t1=clamp(d/5,0,1), t2=clamp((d-5)/5,0,1);
  let c=[0,1,2].map(i=>lerp(warm[i],cold[i],t1));
  c=[0,1,2].map(i=>lerp(c[i],blood[i],t2));
  return c.map(v=>clamp(v+h,0,255));
}
function shade(c,l){return `rgb(${c[0]*l|0},${c[1]*l|0},${c[2]*l|0})`;}

function renderLighting(ox,oy,sx,sy){
  const p=G.player;
  const flick=.88+.12*Math.sin(tNow*6.3)+.05*Math.sin(tNow*11.1);
  lmCtx.setTransform(DPR,0,0,DPR,0,0);
  lmCtx.globalCompositeOperation='source-over';
  lmCtx.clearRect(0,0,VW,VH);
  const darkA=clamp(.38+G.depth*.03,0,.7);
  lmCtx.fillStyle=G.depth>=8?`rgba(14,3,6,${darkA})`:`rgba(4,5,10,${darkA})`;
  lmCtx.fillRect(0,0,VW,VH);
  lmCtx.globalCompositeOperation='destination-out';
  const hole=(wx,wy,r,a)=>{
    if(r<=0||a<=0)return;
    const x=ox+sx+wx*TS, y=oy+sy+wy*TS;
    if(x<-r||y<-r||x>VW+r||y>VH+r)return;
    const g=lmCtx.createRadialGradient(x,y,r*.04,x,y,r);
    g.addColorStop(0,`rgba(0,0,0,${clamp(a,0,1)})`);
    g.addColorStop(.5,`rgba(0,0,0,${clamp(a*.6,0,1)})`);
    g.addColorStop(1,'rgba(0,0,0,0)');
    lmCtx.fillStyle=g;
    lmCtx.fillRect(x-r,y-r,r*2,r*2);
  };
  hole(p.rx+.5,p.ry+.5,p.sight*TS*.94,.9*flick);
  const st=G.stairs;
  if(st.x>=0&&G.visible[st.y]&&G.visible[st.y][st.x])
    hole(st.x+.5,st.y+.5,1.5*TS,.4+.15*Math.sin(tNow*2.4));
  for(const pr of projectiles){
    const x=lerp(pr.x0,pr.x1,pr.p), y=lerp(pr.y0,pr.y1,pr.p);
    hole(x,y,(pr.big?2.6:1.4)*TS,.7);
  }
  for(const b of bolts)
    for(const pt of b.pts)hole(pt.x,pt.y,1.1*TS,.45*b.life);
  for(const r of rings)hole(r.x,r.y,(r.r+.7)*TS,.35*r.life);
  if(casting)hole(p.x+.5,p.y+.5,TS*3.4,.85);
  for(const ef of effects){
    if(ef.type==='meteor'&&ef.t>0)hole(ef.tx,ef.ty,TS*2,.6);
    if(ef.type==='firepit')hole(ef.x,ef.y,ef.r*TS*1.6,.6*(1-ef.t/ef.dur));
    if(ef.type==='storm')hole(ef.x,ef.y,TS*(2+ef.blades),.5);
    if(ef.type==='shockwave')hole(ef.x,ef.y,ef.maxR*TS*.9,.35*(1-ef.t/ef.dur));
  }
  ctx.drawImage(LM,0,0,VW,VH);
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  const glow=(wx,wy,r,rgb,a)=>{
    if(a<=0)return;
    const x=ox+sx+wx*TS, y=oy+sy+wy*TS;
    if(x<-r||y<-r||x>VW+r||y>VH+r)return;
    const g=ctx.createRadialGradient(x,y,0,x,y,r);
    g.addColorStop(0,`rgba(${rgb},${a})`);
    g.addColorStop(1,`rgba(${rgb},0)`);
    ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
  };
  glow(p.rx+.5,p.ry+.5,TS*2.6,'255,170,80',.08*flick);
  for(const pr of projectiles){
    const x=lerp(pr.x0,pr.x1,pr.p), y=lerp(pr.y0,pr.y1,pr.p);
    glow(x,y,TS*(pr.big?2:1.2),'255,120,40',pr.big?.2:.1);
  }
  if(st.x>=0&&G.visible[st.y]&&G.visible[st.y][st.x])
    glow(st.x+.5,st.y+.5,TS*1.2,'232,201,106',.09*(.6+.4*Math.sin(tNow*2.4)));
  for(const b of bolts){
    const mid=b.pts[Math.floor(b.pts.length/2)];
    glow(mid.x,mid.y,TS*2.2,'120,220,255',.14*b.life);
  }
  if(casting){
    const parts=casting.parts;
    for(let k=0;k<parts.length;k++){
      const e=ELEM[SKILLS[parts[k]].id];
      const a=tNow*2+k*(Math.PI*2/parts.length);
      glow(p.x+.5+Math.cos(a)*.9,p.y+.5+Math.sin(a)*.9,TS*1.4,e.rgb,.25);
    }
  }
  for(const ef of effects){
    if(ef.type==='meteor'&&ef.t>0)glow(ef.tx,ef.ty,TS*2.4,'255,122,42',.3);
    if(ef.type==='firepit')glow(ef.x,ef.y,ef.r*TS*1.8,'255,100,30',.3*(1-ef.t/ef.dur));
    if(ef.type==='storm')glow(ef.x,ef.y,TS*(2.5+ef.blades),'232,201,106',.2);
    if(ef.type==='slash')glow(ef.x,ef.y,TS*1.6,'255,58,74',.25*(1-ef.t/ef.dur));
    if(ef.type==='catalyst')glow(ef.x,ef.y,TS*2.4,'77,208,196',.2*(1-ef.t/ef.dur));
  }
  for(const sc of scorches){
    const a=clamp(sc.life/8,0,1)*.15;
    glow(sc.x,sc.y,sc.r*TS,'180,60,20',a);
  }
  ctx.restore();
}

function drawEffects(){
  const t=tNow;
  for(let i=effects.length-1;i>=0;i--){
    const ef=effects[i];
    ef.t+=1/60;
    if(ef.type==='meteor'){
      if(ef.t<ef.delay)continue;
      const ft=(ef.t-ef.delay)/.45;
      if(ft>=1){
        effects.splice(i,1);
        sfx.meteor(); shake=Math.max(shake,8);
        rings.push({x:ef.tx,y:ef.ty,r:.2,max:1.6+ef.scorchR,color:'#ff7a2a',life:1});
        rings.push({x:ef.tx,y:ef.ty,r:.1,max:1,color:'#ffd766',life:1});
        burst(ef.tx,ef.ty,'#ff7a2a',18,{spd:4});
        burst(ef.tx,ef.ty,'#ffd766',10,{spd:2});
        scorches.push({x:ef.tx,y:ef.ty,r:ef.scorchR,life:8,elem:'fire'});
        for(const m of G.monsters)
          if(m.alive&&cheb(m.x,m.y,Math.floor(ef.tx),Math.floor(ef.ty))<=1)
            skillHit(m,ef.mult,true);
        updateHUD();
        continue;
      }
      const sx=ef.tx+3*(1-ft), sy=ef.ty-5*(1-ft);
      ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.strokeStyle='rgba(255,150,50,.5)';ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(sx*TS,sy*TS);
      ctx.lineTo((sx+.9)*TS,(sy+1.5)*TS);
      ctx.stroke();
      ctx.fillStyle='#ff7a2a';
      ctx.beginPath();ctx.arc(sx*TS,sy*TS,TS*.3,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ffe8a0';
      ctx.beginPath();ctx.arc(sx*TS,sy*TS,TS*.15,0,Math.PI*2);ctx.fill();
      const pul=.4+.3*Math.sin(t*14);
      ctx.strokeStyle=`rgba(255,122,42,${pul})`;ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(ef.tx*TS,ef.ty*TS,TS*.6,0,Math.PI*2);ctx.stroke();
      ctx.restore();
      continue;
    }
    if(ef.t>=ef.dur){effects.splice(i,1);continue;}
    const pr=ef.t/ef.dur;
    if(ef.type==='shockwave'){
      const R=ef.maxR*pr;
      ctx.save();
      ctx.strokeStyle=ef.color;
      ctx.globalAlpha=(1-pr)*.9;
      ctx.lineWidth=4*(1-pr)+1;
      ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,R*TS,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=(1-pr)*.5;
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,R*TS*.8,0,Math.PI*2);ctx.stroke();
      ctx.globalAlpha=(1-pr)*.15;
      ctx.fillStyle=ef.color;
      ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,R*TS,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    else if(ef.type==='firepit'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const a=1-pr;
      for(let k=0;k<3;k++){
        const rr=ef.r*TS*(0.6+k*.25)*(1-pr*.3);
        ctx.strokeStyle=`rgba(255,${120-k*30},40,${a*.7})`;
        ctx.lineWidth=3;
        ctx.beginPath();ctx.arc(ef.x*TS,ef.y*TS,rr,0,Math.PI*2);ctx.stroke();
      }
      for(let k=0;k<10;k++){
        const ang=k/10*Math.PI*2+pr*3;
        const fx=ef.x+Math.cos(ang)*ef.r*.7*rnd(.8,1);
        const fy=ef.y+Math.sin(ang)*ef.r*.7*rnd(.8,1);
        ctx.fillStyle=`rgba(255,${ri(120,200)},40,${a*.8})`;
        const sz=TS*.18*a;
        ctx.beginPath();ctx.arc(fx*TS,fy*TS-pr*TS*.5,sz,0,Math.PI*2);ctx.fill();
      }
      ctx.restore();
    }
    else if(ef.type==='storm'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const spin=t*(8+ef.blades*2);
      for(let b=0;b<ef.blades;b++){
        const a=1-pr;
        ctx.strokeStyle=`rgba(232,201,106,${a*.85})`;
        ctx.lineWidth=3;
        const rr=TS*(1+b*.35);
        for(let seg=0;seg<2;seg++){
          ctx.beginPath();
          ctx.arc(ef.x*TS,ef.y*TS,rr,spin+b*2.1+seg*Math.PI,spin+b*2.1+seg*Math.PI+2.2);
          ctx.stroke();
        }
      }
      if(Math.random()<.6){
        const ang=rnd(0,Math.PI*2);
        particles.push({x:ef.x,y:ef.y,vx:Math.cos(ang)*3,vy:Math.sin(ang)*3-1,
          life:.4,maxLife:1,color:'#e8c96a',size:2,grav:2});
      }
      ctx.restore();
    }
    else if(ef.type==='slash'){
      if(ef.t<0)continue;
      const a=1-pr;
      ctx.save();
      ctx.lineCap='round';
      ctx.strokeStyle=`rgba(255,58,74,${a})`;
      ctx.lineWidth=5*a+1;
      const cx=ef.x*TS, cy=ef.y*TS, R=TS*1.1;
      const a0=-2.2+pr*4.4;
      ctx.beginPath();ctx.arc(cx,cy,R,a0,a0+1.8);ctx.stroke();
      ctx.strokeStyle=`rgba(255,200,200,${a*.8})`;
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(cx,cy,R*.8,a0+.2,a0+1.6);ctx.stroke();
      ctx.restore();
    }
    else if(ef.type==='catalyst'){
      ctx.save();ctx.globalCompositeOperation='lighter';
      const a=1-pr;
      for(let k=0;k<3;k++){
        const rr=TS*(1+k*.5);
        const rot=t*2+k*2;
        ctx.strokeStyle=`rgba(77,208,196,${a*.6})`;
        ctx.lineWidth=1.5;
        ctx.beginPath();
        for(let s=0;s<6;s++){
          const ang=rot+s/6*Math.PI*2;
          const px=ef.x*TS+Math.cos(ang)*rr, py=ef.y*TS+Math.sin(ang)*rr;
          if(s===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
        }
        ctx.closePath();ctx.stroke();
      }
      ctx.restore();
    }
  }
}

function drawCasting(){
  const p=G.player, c=casting;
  const prog=c.t/c.dur;
  const cx=p.rx*TS+TS/2, cy=p.ry*TS+TS/2;
  const parts=c.parts;
  const colors=parts.map(i=>ELEM[SKILLS[i].id].color);
  ctx.save();
  const R1=TS*(1+prog*1.6), R2=TS*(.65+prog*1.1);
  ctx.globalCompositeOperation='lighter';
  for(let ring=0;ring<2;ring++){
    const R=ring?R2:R1, rot=tNow*(ring?-1.6:2.2);
    ctx.strokeStyle=colors[ring%colors.length];
    ctx.globalAlpha=.35+prog*.55;
    ctx.lineWidth=ring?1.5:2.5;
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
    const n=ring?6:12;
    for(let k=0;k<n;k++){
      const a=rot+k/n*Math.PI*2;
      const px=cx+Math.cos(a)*R, py=cy+Math.sin(a)*R;
      ctx.save();ctx.translate(px,py);ctx.rotate(a+Math.PI/2);
      ctx.fillStyle=colors[k%colors.length];
      ctx.globalAlpha=.5+prog*.5;
      ctx.fillRect(-1.6,-4,3.2,8);
      ctx.restore();
    }
  }
  const bg=ctx.createLinearGradient(0,cy-TS*3.5,0,cy);
  bg.addColorStop(0,'rgba(255,255,255,0)');
  bg.addColorStop(1,`rgba(255,255,255,${.1+prog*.28})`);
  ctx.globalAlpha=1;
  ctx.fillStyle=bg;
  ctx.fillRect(cx-TS*.35*(0.4+prog),cy-TS*3.5,TS*.7*(0.4+prog),TS*3.5);
  for(let k=0;k<parts.length;k++){
    const e=ELEM[SKILLS[parts[k]].id];
    const a=tNow*3.5+k*(Math.PI*2/parts.length);
    const rr=TS*(.9+prog*.5);
    const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr;
    ctx.fillStyle=e.color;
    ctx.globalAlpha=.9;
    ctx.beginPath();ctx.arc(px,py,4+prog*3,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=.3;
    ctx.beginPath();ctx.arc(px,py,9+prog*4,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  if(Math.random()<.85){
    const a=rnd(0,Math.PI*2), d=rnd(2.5,4.5);
    particles.push({x:p.x+.5+Math.cos(a)*d,y:p.y+.5+Math.sin(a)*d,
      vx:-Math.cos(a)*(d*1.4),vy:-Math.sin(a)*(d*1.4),
      life:.32,maxLife:1,color:pick(colors),size:rnd(1.5,3),grav:0,
      suck:true});
  }
}

function draw(){
  const t=tNow;
  ctx.fillStyle='#080706'; ctx.fillRect(0,0,VW,VH);
  if(!G)return;

  const p=G.player;
  if(state==='title'){
    camX=MAP_W/2+Math.cos(t*.07)*6; camY=MAP_H/2+Math.sin(t*.05)*4;
  }else{
    camX=lerp(camX,p.x,.09); camY=lerp(camY,p.y,.09);
  }
  const cx=camX, cy=camY;
  const ox=VW/2-cx*TS, oy=VH/2-cy*TS;
  const sx=(Math.random()-.5)*shake, sy=(Math.random()-.5)*shake;
  shake*=.86; if(shake<.3)shake=0;
  ctx.save();
  ctx.translate(ox+sx,oy+sy);

  const x0=Math.max(0,Math.floor(cx-VW/TS/2)-1), x1=Math.min(MAP_W-1,Math.ceil(cx+VW/TS/2)+1);
  const y0=Math.max(0,Math.floor(cy-VH/TS/2)-1), y1=Math.min(MAP_H-1,Math.ceil(cy+VH/TS/2)+1);
  const flick=.9+.1*Math.sin(t*7)+.03*Math.sin(t*13.7);

  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    if(!G.explored[y]||!G.explored[y][x])continue;
    const vis=G.visible[y][x];
    let light;
    if(vis){
      const d=Math.sqrt(dist2(x,y,p.x,p.y));
      light=clamp(1.05-Math.pow(d/p.sight,1.6),0,1)*flick;
      light=Math.max(light,.16);
    }else light=.12;
    const px=x*TS, py=y*TS, tile=G.map[y][x];
    if(tile===WALL){
      const face=(y+1<MAP_H&&G.explored[y+1][x]&&G.map[y+1][x]!==WALL);
      if(face){
        ctx.fillStyle=shade([52,46,40],light);
        ctx.fillRect(px,py,TS,TS);
        const wg=ctx.createLinearGradient(0,py,0,py+TS);
        wg.addColorStop(0,'rgba(0,0,0,.22)');
        wg.addColorStop(.35,'rgba(0,0,0,0)');
        wg.addColorStop(1,'rgba(0,0,0,.28)');
        ctx.fillStyle=wg; ctx.fillRect(px,py,TS,TS);
        ctx.strokeStyle=shade([28,24,20],light);
        ctx.lineWidth=1;
        for(let r=0;r<3;r++){
          const yy=py+4+r*(TS/3);
          ctx.beginPath();ctx.moveTo(px,yy);ctx.lineTo(px+TS,yy);ctx.stroke();
          const off=(r%2)*TS/2;
          ctx.beginPath();ctx.moveTo(px+off,yy);ctx.lineTo(px+off,yy+TS/3);ctx.stroke();
        }
      }else{
        ctx.fillStyle=shade([30,27,23],light);
        ctx.fillRect(px,py,TS,TS);
        ctx.fillStyle=shade([44,39,33],light);
        ctx.fillRect(px,py,TS,3);
        if(hash2(x*3,y*7)>.82){
          ctx.fillStyle=shade([20,18,15],light);
          ctx.fillRect(px+TS*.3,py+TS*.35,TS*.25,TS*.2);
        }
      }
    }else{
      const c=floorTone(G.depth,x,y);
      ctx.fillStyle=shade(c,light);
      ctx.fillRect(px,py,TS,TS);
      ctx.fillStyle=shade(c,light*.72);
      ctx.fillRect(px,py+TS-2,TS,2); ctx.fillRect(px,py,2,TS);
      if(y>0&&G.map[y-1][x]===WALL){
        const sg=ctx.createLinearGradient(0,py,0,py+TS*.4);
        sg.addColorStop(0,'rgba(0,0,0,.3)');
        sg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=sg;ctx.fillRect(px,py,TS,TS*.4);
      }
      if(x>0&&G.map[y][x-1]===WALL){
        const sg=ctx.createLinearGradient(px,0,px+TS*.35,0);
        sg.addColorStop(0,'rgba(0,0,0,.22)');
        sg.addColorStop(1,'rgba(0,0,0,0)');
        ctx.fillStyle=sg;ctx.fillRect(px,py,TS*.35,TS);
      }
      if(hash2(x*13,y*5)>.9){
        ctx.strokeStyle=shade(c,light*.6); ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(px+TS*.3,py+TS*.4);
        ctx.lineTo(px+TS*.55,py+TS*.6); ctx.lineTo(px+TS*.5,py+TS*.8);
        ctx.stroke();
      }
    }
  }

  for(let i=scorches.length-1;i>=0;i--){
    const sc=scorches[i];
    sc.life-=1/60;
    if(sc.life<=0){scorches.splice(i,1);continue;}
    const a=clamp(sc.life/8,0,1);
    const tx=Math.floor(sc.x), ty=Math.floor(sc.y);
    if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H||!G.explored[ty][tx])continue;
    ctx.save();
    ctx.globalAlpha=a*.55;
    ctx.fillStyle='#160a06';
    ctx.beginPath();ctx.ellipse(sc.x*TS,sc.y*TS,sc.r*TS*.85,sc.r*TS*.6,0,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=a*.35;
    ctx.fillStyle='#2a0f08';
    ctx.beginPath();ctx.ellipse(sc.x*TS,sc.y*TS,sc.r*TS*.55,sc.r*TS*.38,0,0,Math.PI*2);ctx.fill();
    if(Math.random()<.15){
      ctx.globalAlpha=a*.7;
      ctx.fillStyle='#ff6a30';
      ctx.fillRect(sc.x*TS+rnd(-sc.r*TS*.5,sc.r*TS*.5),sc.y*TS+rnd(-sc.r*TS*.4,sc.r*TS*.4),2,2);
    }
    ctx.restore();
  }

  if(aim&&state==='play'){
    const sk=SKILLS[aim.i];
    ctx.strokeStyle='rgba(77,208,196,.35)'; ctx.lineWidth=1.5;
    ctx.setLineDash([6,6]);
    ctx.beginPath();
    ctx.arc(p.x*TS+TS/2,p.y*TS+TS/2,sk.range*TS,0,Math.PI*2);
    ctx.stroke();
    ctx.setLineDash([]);
    const valid=aimValid();
    for(let yy=aim.y-1;yy<=aim.y+1;yy++)for(let xx=aim.x-1;xx<=aim.x+1;xx++){
      if(xx<0||yy<0||xx>=MAP_W||yy>=MAP_H)continue;
      ctx.fillStyle=valid?'rgba(255,122,42,.18)':'rgba(120,60,60,.15)';
      ctx.fillRect(xx*TS,yy*TS,TS,TS);
    }
    const pul=.6+.4*Math.sin(t*8);
    ctx.strokeStyle=valid?`rgba(255,122,42,${pul})`:`rgba(200,60,60,${pul})`;
    ctx.lineWidth=2;
    const ax=aim.x*TS+TS/2, ay=aim.y*TS+TS/2, r=TS*.55;
    ctx.beginPath();
    ctx.moveTo(ax-r,ay);ctx.lineTo(ax-r*.4,ay);
    ctx.moveTo(ax+r,ay);ctx.lineTo(ax+r*.4,ay);
    ctx.moveTo(ax,ay-r);ctx.lineTo(ax,ay-r*.4);
    ctx.moveTo(ax,ay+r);ctx.lineTo(ax,ay+r*.4);
    ctx.stroke();
    ctx.strokeRect(aim.x*TS+3,aim.y*TS+3,TS-6,TS-6);
  }

  const st=G.stairs;
  if(st.x>=0&&G.explored[st.y][st.x]&&G.depth<MAX_DEPTH){
    const vis=G.visible[st.y][st.x];
    const l=vis?1:.35, ccx=st.x*TS+TS/2, ccy=st.y*TS+TS/2;
    const pul=.7+.3*Math.sin(t*2.4);
    for(let i=3;i>=1;i--){
      ctx.strokeStyle=`rgba(201,162,39,${.25*l*pul*i/3})`;
      ctx.lineWidth=2;
      ctx.beginPath();
      ctx.arc(ccx,ccy,i*TS*.16,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.save();
    ctx.translate(ccx,ccy); ctx.rotate(t*1.2);
    ctx.strokeStyle=`rgba(232,201,106,${.85*l})`; ctx.lineWidth=2.5;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc(0,0,TS*.3,i*2.09,i*2.09+1.3);
      ctx.stroke();
    }
    ctx.restore();
    ctx.fillStyle=`rgba(232,201,106,${.6*l*pul})`;
    ctx.beginPath();ctx.arc(ccx,ccy,3,0,Math.PI*2);ctx.fill();
  }

  for(const it of G.items){
    if(!G.explored[it.y][it.x])continue;
    const vis=G.visible[it.y][it.x];
    const l=vis?1:.3;
    const bob=Math.sin(t*2.5+it.seed)*2;
    const ccx=it.x*TS+TS/2, ccy=it.y*TS+TS/2+bob;
    if(vis){
      const g=ctx.createRadialGradient(ccx,ccy,1,ccx,ccy,TS*.7);
      g.addColorStop(0,'rgba(232,201,106,.16)');g.addColorStop(1,'rgba(232,201,106,0)');
      ctx.fillStyle=g;ctx.fillRect(ccx-TS*.7,ccy-TS*.7,TS*1.4,TS*1.4);
    }
    ctx.globalAlpha=l;
    drawItemIcon(it,ccx,ccy,t);
    ctx.globalAlpha=1;
  }

  for(const m of G.monsters){
    if(!m.alive)continue;
    if(!G.visible[m.y]||!G.visible[m.y][m.x])continue;
    m.rx=lerp(m.rx,m.x,.28); m.ry=lerp(m.ry,m.y,.28);
    if(m.flash>0)m.flash-=.08;
    let lx=0,ly=0;
    if(m.lunge){ m.lunge.t-=.12;
      if(m.lunge.t>0){const k=Math.sin(m.lunge.t*Math.PI)*.4;lx=m.lunge.dx*k;ly=m.lunge.dy*k;}
      else m.lunge=null;}
    const ccx=m.rx*TS+TS/2+lx*TS, ccy=m.ry*TS+TS/2+ly*TS;
    if(m.charging){
      const pul=.5+.5*Math.sin(t*10);
      ctx.strokeStyle=`rgba(192,57,43,${.3+.4*pul})`;
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(ccx,ccy,TS*2.4,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=`rgba(192,57,43,${.08*pul})`;
      ctx.beginPath();ctx.arc(ccx,ccy,TS*2.4,0,Math.PI*2);ctx.fill();
    }
    ctx.fillStyle='rgba(0,0,0,.4)';
    ctx.beginPath();ctx.ellipse(ccx,m.ry*TS+TS*.86,TS*.26,TS*.09,0,0,Math.PI*2);ctx.fill();
    drawMob(m,ccx,ccy,t);
    if(m.flash>0){
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=m.flash*.7;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(ccx,ccy,TS*.4,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
    if(m.windup){
      const pul=.6+.4*Math.sin(t*12);
      ctx.font=`800 ${TS*.55|0}px Cinzel,serif`;
      ctx.textAlign='center';
      ctx.fillStyle=`rgba(224,122,58,${pul})`;
      ctx.fillText('!',ccx,ccy-TS*.62);
      ctx.strokeStyle=`rgba(224,122,58,${.5*pul})`;ctx.lineWidth=1.5;
      ctx.strokeRect(m.x*TS+2,m.y*TS+2,TS-4,TS-4);
    }
    if(m.hpShow>0&&(m.hp<m.maxhp||m.boss)){
      m.hpShow-=.012;
      const w=TS*.8, yy=ccy-TS*.55;
      ctx.fillStyle='#000a';ctx.fillRect(ccx-w/2,yy,w,4);
      ctx.fillStyle=m.boss?'#c0392b':'#a83a2e';
      ctx.fillRect(ccx-w/2+.5,yy+.5,(w-1)*clamp(m.hp/m.maxhp,0,1),3);
    }
  }

  for(let i=p.dashTrail.length-1;i>=0;i--){
    const d=p.dashTrail[i];
    d.life-=.06;
    if(d.life<=0){p.dashTrail.splice(i,1);continue;}
    ctx.globalAlpha=d.life*.35;
    ctx.fillStyle='#4dd0c4';
    ctx.beginPath();
    ctx.arc(d.x*TS+TS/2,d.y*TS+TS/2,TS*.26,0,Math.PI*2);
    ctx.fill();
    ctx.globalAlpha=1;
  }

  p.rx=lerp(p.rx,p.x,.3); p.ry=lerp(p.ry,p.y,.3);
  if(p.flash>0)p.flash-=.08;
  if(p.spinT>0)p.spinT-=.05;
  let plx=0,ply=0;
  if(p.lunge){ p.lunge.t-=.14;
    if(p.lunge.t>0){const k=Math.sin(p.lunge.t*Math.PI)*.45;plx=p.lunge.dx*k;ply=p.lunge.dy*k;}
    else p.lunge=null;}
  {
    const ccx=p.rx*TS+TS/2+plx*TS, ccy=p.ry*TS+TS/2+ply*TS;
    const walkBob=(Math.abs(p.rx-p.x)+Math.abs(p.ry-p.y))>.05?Math.sin(t*22)*1.5:Math.sin(t*2+p.seed)*.8;
    ctx.fillStyle='rgba(0,0,0,.45)';
    ctx.beginPath();ctx.ellipse(ccx,p.ry*TS+TS*.88,TS*.24,TS*.08,0,0,Math.PI*2);ctx.fill();
    drawPlayer(ccx,ccy+walkBob*.3,t,p.dir);
    if(p.spinT>0){
      const ang=(1-p.spinT)*Math.PI*4;
      ctx.save();ctx.translate(ccx,ccy);ctx.rotate(ang);
      ctx.strokeStyle=`rgba(232,201,106,${p.spinT*.9})`;
      ctx.lineWidth=3;
      ctx.beginPath();ctx.arc(0,0,TS*1.1,0,2.4);ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,TS*.8,Math.PI,Math.PI+2.4);ctx.stroke();
      ctx.restore();
    }
    if(p.shield>0){
      const pul=.5+.5*Math.sin(t*4);
      ctx.save();
      ctx.strokeStyle=`rgba(77,208,196,${.5+.3*pul})`;
      ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(ccx,ccy-2,TS*.62,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle=`rgba(77,208,196,${.06+.05*pul})`;
      ctx.beginPath();ctx.arc(ccx,ccy-2,TS*.62,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=`rgba(77,208,196,${.25*pul})`;
      ctx.lineWidth=1;
      ctx.beginPath();ctx.arc(ccx,ccy-2,TS*.62,t*.8,t*.8+1.2);ctx.stroke();
      ctx.beginPath();ctx.arc(ccx,ccy-2,TS*.62,t*.8+Math.PI,t*.8+Math.PI+1.2);ctx.stroke();
      ctx.restore();
    }
    if(p.flash>0){
      ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=p.flash*.6;
      ctx.fillStyle='#ff5040';
      ctx.beginPath();ctx.arc(ccx,ccy,TS*.42,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }
  }

  if(casting)drawCasting();

  for(let i=projectiles.length-1;i>=0;i--){
    const pr=projectiles[i];
    pr.p+=pr.speed||.14;
    if(pr.p>=1){
      projectiles.splice(i,1);
      if(pr.onDone)pr.onDone();
      continue;
    }
    const x=lerp(pr.x0,pr.x1,pr.p), y=lerp(pr.y0,pr.y1,pr.p);
    const size=pr.big?7:4;
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle=pr.color;
    ctx.beginPath();ctx.arc(x*TS,y*TS,size,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=pr.big?'rgba(255,122,42,.3)':'rgba(224,122,58,.35)';
    ctx.beginPath();ctx.arc(x*TS,y*TS,size*2,0,Math.PI*2);ctx.fill();
    if(pr.big){
      const bx=lerp(pr.x0,pr.x1,Math.max(0,pr.p-.12));
      ctx.fillStyle='rgba(255,200,100,.35)';
      ctx.beginPath();ctx.arc(bx*TS,y*TS,size*.8,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }

  for(let i=bolts.length-1;i>=0;i--){
    const b=bolts[i];
    b.life-=.07;
    if(b.life<=0){bolts.splice(i,1);continue;}
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.lineJoin='round';
    ctx.strokeStyle=`rgba(110,210,255,${.5*b.life})`;
    ctx.lineWidth=4.5*b.life+1;
    ctx.beginPath();
    b.pts.forEach((pt,k)=>k?ctx.lineTo(pt.x*TS,pt.y*TS):ctx.moveTo(pt.x*TS,pt.y*TS));
    ctx.stroke();
    ctx.strokeStyle=`rgba(255,255,255,${.9*b.life})`;
    ctx.lineWidth=1.6;
    ctx.stroke();
    ctx.restore();
  }

  drawEffects();

  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];
    r.life-=.035;
    r.r=lerp(r.r,r.max,.14);
    if(r.life<=0){rings.splice(i,1);continue;}
    ctx.strokeStyle=r.color;
    ctx.globalAlpha=clamp(r.life,0,1)*.8;
    ctx.lineWidth=3*r.life+1;
    ctx.beginPath();
    ctx.arc(r.x*TS,r.y*TS,r.r*TS,0,Math.PI*2);
    ctx.stroke();
    ctx.globalAlpha=1;
  }

  for(let i=particles.length-1;i>=0;i--){
    const pt=particles[i];
    pt.life-=.016;
    if(pt.life<=0){particles.splice(i,1);continue;}
    if(pt.suck){
      pt.vx*=1.12; pt.vy*=1.12;
    }
    pt.x+=pt.vx*.016; pt.y+=pt.vy*.016; pt.vy+=pt.grav*.016;
    ctx.globalAlpha=clamp(pt.life/pt.maxLife,0,1)*.9;
    ctx.fillStyle=pt.color;
    ctx.fillRect(pt.x*TS-pt.size/2,pt.y*TS-pt.size/2,pt.size,pt.size);
  }
  ctx.globalAlpha=1;

  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const mo of motes){
    const tx=Math.floor(mo.x), ty=Math.floor(mo.y);
    if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H||!G.visible[ty]||!G.visible[ty][tx])continue;
    ctx.globalAlpha=Math.sin(mo.life/mo.max*Math.PI)*.45;
    ctx.fillStyle=mo.ember?'#ffb060':'#ffe8c0';
    ctx.fillRect(mo.x*TS,mo.y*TS,mo.size,mo.size);
  }
  ctx.restore();ctx.globalAlpha=1;
  ctx.restore();

  renderLighting(ox,oy,sx,sy);

  ctx.save();
  ctx.translate(ox+sx,oy+sy);
  ctx.textAlign='center'; ctx.font='700 15px "Noto Serif SC"';
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i];
    f.life-=.018; f.y-=.012;
    if(f.life<=0){floaters.splice(i,1);continue;}
    ctx.globalAlpha=clamp(f.life*1.4,0,1);
    ctx.fillStyle='#000';ctx.fillText(f.text,f.x*TS+1,f.y*TS+1);
    ctx.fillStyle=f.color;ctx.fillText(f.text,f.x*TS,f.y*TS);
  }
  ctx.globalAlpha=1;
  ctx.restore();

  if(G.banner&&state!=='title'){
    G.banner.life-=.0045;
    if(G.banner.life<=0)G.banner=null;
    else{
      const a=clamp(G.banner.life*1.6,0,1);
      ctx.save();ctx.textAlign='center';
      ctx.globalAlpha=a;
      ctx.shadowColor='#000';ctx.shadowBlur=10;
      ctx.font=`800 ${Math.min(46,VW*.09)|0}px Cinzel,serif`;
      ctx.fillStyle='#e8c96a';
      ctx.fillText(G.banner.main,VW/2,VH*.28);
      ctx.font='600 14px "Noto Serif SC"';
      ctx.shadowBlur=4;
      ctx.fillStyle='#b8ae98';
      ctx.fillText(G.banner.sub,VW/2,VH*.28+30);
      ctx.restore();
    }
  }

  if(flashScreen>0){
    flashScreen-=.03;
    ctx.fillStyle=`rgba(200,50,40,${clamp(flashScreen,0,1)*.35})`;
    ctx.fillRect(0,0,VW,VH);
  }
  if(flashColor){
    flashColor.a-=.035;
    if(flashColor.a<=0)flashColor=null;
    else{
      ctx.save();ctx.globalCompositeOperation='lighter';
      ctx.globalAlpha=clamp(flashColor.a,0,1)*.5;
      ctx.fillStyle=flashColor.color;
      ctx.fillRect(0,0,VW,VH);
      ctx.restore();
    }
  }
  if(fadeDir!==0){
    fadeA+=fadeDir*.05;
    if(fadeA>=1){fadeA=1;fadeDir=0;}
    if(fadeA<=0){fadeA=0;fadeDir=0;}
    ctx.fillStyle=`rgba(5,4,3,${clamp(fadeA,0,1)})`;
    ctx.fillRect(0,0,VW,VH);
  }
  const vg=ctx.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.35,VW/2,VH/2,Math.max(VW,VH)*.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,VW,VH);
}

/* ---------- 角色绘制 ---------- */
function drawPlayer(cx,cy,t,dir){
  const s=TS/34;
  ctx.save();ctx.translate(cx,cy);ctx.scale(dir,1);
  ctx.fillStyle='#39424e';
  ctx.beginPath();
  ctx.moveTo(-6*s,-6*s);ctx.lineTo(6*s,-6*s);
  ctx.lineTo(8*s,11*s);ctx.lineTo(-8*s,11*s);ctx.closePath();ctx.fill();
  ctx.fillStyle='#cfd6dd';
  ctx.beginPath();
  ctx.moveTo(-4*s,-5*s);ctx.lineTo(4*s,-5*s);
  ctx.lineTo(5*s,9*s);ctx.lineTo(-5*s,9*s);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c9a227';ctx.fillRect(-4.5*s,2*s,9*s,2.5*s);
  ctx.fillStyle='#8a93a0';
  ctx.beginPath();ctx.arc(0,-9*s,4.5*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#12100d';
  ctx.beginPath();ctx.arc(1.2*s,-9*s,2.6*s,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#e8c96a';
  ctx.fillRect(1.2*s,-9.8*s,1.6*s,1.4*s);
  const sw=Math.sin(t*3)*.06;
  ctx.save();ctx.translate(6*s,-2*s);ctx.rotate(.5+sw);
  ctx.fillStyle='#b9c2cc';ctx.fillRect(-1*s,-11*s,2*s,12*s);
  ctx.fillStyle='#c9a227';ctx.fillRect(-3*s,1*s,6*s,2*s);
  ctx.fillStyle='#6b5a2a';ctx.fillRect(-1*s,3*s,2*s,4*s);
  ctx.restore();
  ctx.restore();
}
function drawMob(m,cx,cy,t){
  const s=TS/34;
  ctx.save();ctx.translate(cx,cy);
  const d=m.dir||1;
  switch(m.key){
    case 'slime':{
      const sq=1+Math.sin(t*4+m.seed)*.12;
      ctx.fillStyle='#5a8f4a';
      ctx.beginPath();ctx.ellipse(0,4*s,10*s*sq,7*s/sq,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#7fb56a';
      ctx.beginPath();ctx.ellipse(-3*s,1*s,3.5*s,2*s,-.5,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#12100d';
      ctx.beginPath();ctx.arc(-3*s,3*s,1.4*s,0,Math.PI*2);ctx.arc(3*s,3*s,1.4*s,0,Math.PI*2);ctx.fill();
      break;}
    case 'bat':{
      const fl=Math.sin(t*14+m.seed)*.6;
      ctx.fillStyle='#6b4a3a';
      for(const w of [-1,1]){
        ctx.save();ctx.scale(w,1);ctx.rotate(fl*.4);
        ctx.beginPath();ctx.moveTo(2*s,0);
        ctx.quadraticCurveTo(10*s,-8*s,14*s,-2*s);
        ctx.quadraticCurveTo(9*s,-1*s,8*s,3*s);
        ctx.quadraticCurveTo(5*s,1*s,2*s,2*s);ctx.closePath();ctx.fill();
        ctx.restore();
      }
      ctx.fillStyle='#4a332a';
      ctx.beginPath();ctx.ellipse(0,0,4*s,5*s,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e05040';
      ctx.beginPath();ctx.arc(-1.5*s,-1*s,1*s,0,Math.PI*2);ctx.arc(1.5*s,-1*s,1*s,0,Math.PI*2);ctx.fill();
      break;}
    case 'skeleton':{
      ctx.fillStyle='#d8d0c0';
      ctx.beginPath();ctx.arc(0,-6*s,5*s,0,Math.PI*2);ctx.fill();
      ctx.fillRect(-2*s,-3*s,4*s,2*s);
      ctx.fillStyle='#12100d';
      ctx.beginPath();ctx.arc(-2*s,-7*s,1.5*s,0,Math.PI*2);ctx.arc(2*s,-7*s,1.5*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#d8d0c0';
      for(let i=0;i<3;i++)ctx.fillRect(-5*s,(-1+i*3)*s,10*s,1.6*s);
      ctx.fillStyle='#b8b0a0';
      ctx.fillRect(-6*s,8*s,3*s,4*s);ctx.fillRect(3*s,8*s,3*s,4*s);
      ctx.save();ctx.scale(d,1);ctx.translate(7*s,0);ctx.rotate(.4);
      ctx.fillStyle='#8a7a60';ctx.fillRect(-1*s,-10*s,2*s,10*s);ctx.restore();
      break;}
    case 'brute':{
      const bob=Math.sin(t*2.5+m.seed)*s;
      ctx.translate(0,bob*.5);
      ctx.save();ctx.scale(d,1);ctx.translate(8*s,-2*s);ctx.rotate(m.windup?-.9:.35);
      ctx.strokeStyle='#6b4a2a';ctx.lineWidth=2.2*s;
      ctx.beginPath();ctx.moveTo(0,8*s);ctx.lineTo(0,-9*s);ctx.stroke();
      ctx.fillStyle='#9aa2a8';
      ctx.beginPath();ctx.moveTo(0,-9*s);ctx.quadraticCurveTo(8*s,-8*s,7*s,-3*s);ctx.lineTo(0,-5*s);ctx.closePath();ctx.fill();
      ctx.restore();
      ctx.fillStyle='#7a5a3a';
      ctx.fillRect(-8*s,-6*s,16*s,15*s);
      ctx.fillStyle='#5a4028';
      ctx.fillRect(-8*s,-6*s,16*s,5*s);
      ctx.fillStyle='#12100d';
      ctx.fillRect(-5*s,-4.5*s,10*s,2.4*s);
      ctx.fillStyle=m.windup?'#ff6a3a':'#e05040';
      ctx.fillRect(-1*s,-4.5*s,2*s,2.4*s);
      ctx.fillStyle='#5a4028';
      ctx.fillRect(-10*s,9*s,4*s,4*s);ctx.fillRect(6*s,9*s,4*s,4*s);
      break;}
    case 'cultist':{
      const bob=Math.sin(t*2+m.seed)*1.5*s;
      ctx.translate(0,bob*.3);
      ctx.fillStyle='#7a2a2a';
      ctx.beginPath();ctx.moveTo(0,-12*s);ctx.lineTo(8*s,10*s);ctx.lineTo(-8*s,10*s);ctx.closePath();ctx.fill();
      ctx.fillStyle='#12100d';
      ctx.beginPath();ctx.arc(0,-6*s,3.8*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#ff9a3a';
      ctx.beginPath();ctx.arc(-1.4*s,-6*s,.9*s,0,Math.PI*2);ctx.arc(1.4*s,-6*s,.9*s,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#5a1d1d';ctx.lineWidth=1.2*s;
      ctx.beginPath();ctx.moveTo(0,-12*s);ctx.lineTo(0,-15*s);ctx.stroke();
      break;}
    case 'knight':{
      ctx.fillStyle='#7a8288';
      ctx.fillRect(-7*s,-6*s,14*s,15*s);
      ctx.fillStyle='#5a6167';
      ctx.fillRect(-7*s,-6*s,14*s,4*s);
      ctx.fillStyle='#12100d';
      ctx.fillRect(-4*s,-5*s,8*s,2.2*s);
      ctx.fillStyle='#e07a3a';
      ctx.fillRect(-.8*s,-5*s,1.6*s,2.2*s);
      ctx.fillStyle='#5a6167';
      ctx.fillRect(-9*s,10*s,4*s,4*s);ctx.fillRect(5*s,10*s,4*s,4*s);
      ctx.save();ctx.scale(d,1);ctx.translate(9*s,0);ctx.rotate(m.windup?-.8:.3);
      ctx.fillStyle='#9aa2a8';ctx.fillRect(-1.2*s,-13*s,2.4*s,13*s);ctx.restore();
      break;}
    case 'wraith':{
      const wob=Math.sin(t*3+m.seed)*2*s;
      ctx.globalAlpha=.75;
      ctx.fillStyle='#1a1d22';
      ctx.beginPath();
      ctx.moveTo(0,-11*s);
      ctx.quadraticCurveTo(9*s,-4*s,7*s+wob,8*s);
      ctx.quadraticCurveTo(3*s,5*s,0,9*s);
      ctx.quadraticCurveTo(-3*s,5*s,-7*s+wob,8*s);
      ctx.quadraticCurveTo(-9*s,-4*s,0,-11*s);ctx.fill();
      ctx.globalAlpha=1;
      ctx.fillStyle='#4dd0c4';
      ctx.beginPath();ctx.arc(-2.4*s,-5*s,1.2*s,0,Math.PI*2);ctx.arc(2.4*s,-5*s,1.2*s,0,Math.PI*2);ctx.fill();
      break;}
    case 'lord':{
      const pul=.5+.5*Math.sin(t*3);
      ctx.save();ctx.globalCompositeOperation='lighter';
      const g=ctx.createRadialGradient(0,4*s,2,0,4*s,20*s);
      g.addColorStop(0,`rgba(192,57,43,${.3+.2*pul})`);g.addColorStop(1,'rgba(192,57,43,0)');
      ctx.fillStyle=g;ctx.fillRect(-22*s,-18*s,44*s,40*s);
      ctx.restore();
      const bob=Math.sin(t*1.6)*2*s;
      ctx.translate(0,bob);
      ctx.strokeStyle='#12100d';ctx.lineWidth=2.4*s;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(-6*s,-13*s);ctx.quadraticCurveTo(-12*s,-20*s,-9*s,-25*s);ctx.stroke();
      ctx.beginPath();ctx.moveTo(6*s,-13*s);ctx.quadraticCurveTo(12*s,-20*s,9*s,-25*s);ctx.stroke();
      ctx.fillStyle='#12100d';
      ctx.beginPath();
      ctx.moveTo(0,-15*s);
      ctx.quadraticCurveTo(13*s,-6*s,10*s,12*s);
      ctx.quadraticCurveTo(0,8*s,-10*s,12*s);
      ctx.quadraticCurveTo(-13*s,-6*s,0,-15*s);ctx.fill();
      ctx.fillStyle=`rgba(232,120,60,${.75+.25*pul})`;
      ctx.beginPath();ctx.arc(0,-7*s,2.2*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=`rgba(232,160,90,${.65+.35*pul})`;
      [[-5,-11],[5,-11],[-7,-3],[7,-3]].forEach(([ex,ey])=>{
        ctx.beginPath();ctx.arc(ex*s,ey*s,1.3*s,0,Math.PI*2);ctx.fill();});
      if(m.charging){
        ctx.save();ctx.globalCompositeOperation='lighter';
        ctx.fillStyle=`rgba(192,57,43,${.25*pul})`;
        ctx.beginPath();ctx.arc(0,-4*s,15*s,0,Math.PI*2);ctx.fill();
        ctx.restore();
      }
      break;}
  }
  ctx.restore();
}
function drawItemIcon(it,cx,cy,t){
  const s=TS/34;
  ctx.save();ctx.translate(cx,cy);
  switch(it.kind){
    case 'gold':{
      ctx.fillStyle='#9a7a1a';ctx.beginPath();ctx.arc(0,2*s,6*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#e8c96a';ctx.beginPath();ctx.arc(0,0,6*s,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#9a7a1a';ctx.lineWidth=1.4*s;
      ctx.beginPath();ctx.arc(0,0,3.5*s,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#fff8dd';ctx.beginPath();ctx.arc(-2*s,-2.4*s,1.2*s,0,Math.PI*2);ctx.fill();
      break;}
    case 'potion':{
      ctx.fillStyle='#4a3a30';ctx.fillRect(-2*s,-9*s,4*s,3.5*s);
      ctx.fillStyle='rgba(200,220,230,.25)';
      ctx.beginPath();ctx.arc(0,1*s,5.5*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#a83a2e';
      ctx.beginPath();ctx.arc(0,1.5*s,4.6*s,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#d9705f';
      ctx.beginPath();ctx.arc(-1.5*s,-.5*s,1.4*s,0,Math.PI*2);ctx.fill();
      break;}
    case 'sword':{
      ctx.rotate(-.7);
      ctx.fillStyle='#b9c2cc';ctx.fillRect(-1.2*s,-11*s,2.4*s,13*s);
      ctx.beginPath();ctx.moveTo(-1.2*s,-11*s);ctx.lineTo(0,-14*s);ctx.lineTo(1.2*s,-11*s);ctx.fill();
      ctx.fillStyle='#c9a227';ctx.fillRect(-3.5*s,2*s,7*s,2*s);
      ctx.fillStyle='#6b5a2a';ctx.fillRect(-1.2*s,4*s,2.4*s,5*s);
      break;}
    case 'armor':{
      ctx.fillStyle='#7a8288';
      ctx.beginPath();ctx.moveTo(0,-9*s);ctx.lineTo(7*s,-6*s);ctx.lineTo(6*s,5*s);
      ctx.lineTo(0,10*s);ctx.lineTo(-6*s,5*s);ctx.lineTo(-7*s,-6*s);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#4a5057';ctx.lineWidth=1.3*s;
      ctx.beginPath();ctx.moveTo(0,-9*s);ctx.lineTo(0,10*s);ctx.stroke();
      ctx.fillStyle='#c9a227';ctx.beginPath();ctx.arc(0,0,1.6*s,0,Math.PI*2);ctx.fill();
      break;}
    case 'heart':{
      const pul=1+Math.sin(t*4)*.06;
      ctx.scale(pul,pul);
      ctx.fillStyle='#a83a2e';
      ctx.beginPath();
      ctx.moveTo(0,9*s);
      ctx.bezierCurveTo(-11*s,0,-7*s,-9*s,0,-3.5*s);
      ctx.bezierCurveTo(7*s,-9*s,11*s,0,0,9*s);ctx.fill();
      ctx.fillStyle='#d9705f';
      ctx.beginPath();ctx.arc(-3*s,-3*s,2*s,0,Math.PI*2);ctx.fill();
      break;}
    case 'chest':{
      ctx.fillStyle='#6b4a2a';ctx.fillRect(-8*s,-2*s,16*s,9*s);
      ctx.fillStyle='#7d5834';
      ctx.beginPath();ctx.moveTo(-8*s,-2*s);
      ctx.quadraticCurveTo(0,-10*s,8*s,-2*s);ctx.fill();
      ctx.fillStyle='#c9a227';
      ctx.fillRect(-1.6*s,-3*s,3.2*s,5*s);
      ctx.fillStyle='#12100d';ctx.fillRect(-.7*s,-1.5*s,1.4*s,2.4*s);
      ctx.strokeStyle='#4a3320';ctx.lineWidth=1.2*s;
      ctx.strokeRect(-8*s,-2*s,16*s,9*s);
      break;}
  }
  ctx.restore();
}

/* ================================================================
   主循环
   ================================================================ */
function loop(ts){
  tNow=ts/1000;
  if(casting&&state==='play'){
    casting.t+=1/60;
    if(casting.t>=casting.dur){
      if(G.player.hp>0)fusionBurst();
      else{casting=null;document.getElementById('castTip').style.display='none';}
    }
  }
  if(heldDir&&state==='play'&&!aim&&!casting){
    holdTimer+=16;
    if(holdTimer>130){holdTimer=0;tryMove(...heldDir);}
  }
  if(autoPath&&state==='play'&&!aim&&!casting){
    autoTimer+=16;
    if(autoTimer>100){
      autoTimer=0;
      const nxt=autoPath[0], p=G.player;
      const dx=nxt[0]-p.x, dy=nxt[1]-p.y;
      if(Math.abs(dx)+Math.abs(dy)!==1){autoPath=null;}
      else{
        autoPath.shift();
        tryMove(dx,dy);
        if(G.monsters.some(m=>m.alive&&m.x===p.x+dx&&m.y===p.y+dy))autoPath=null;
        if(!autoPath.length)autoPath=null;
      }
    }
  }
  for(let i=bolts.length-1;i>=0;i--){bolts[i].life-=.012;if(bolts[i].life<=0)bolts.splice(i,1);}
  if(G&&(state==='play'||state==='title')){
    const p=G.player;
    if(!casting&&motes.length<40&&Math.random()<.4){
      if(Math.random()<.35){
        motes.push({x:p.x+.5+rnd(-.15,.15),y:p.y+.1,
          vx:rnd(-.06,.06),vy:-rnd(.4,.8),life:rnd(.5,1),max:1,size:rnd(1,2),ember:true});
      }else{
        const a=rnd(0,Math.PI*2), d=rnd(1,p.sight*.8);
        motes.push({x:p.x+.5+Math.cos(a)*d,y:p.y+.5+Math.sin(a)*d*.7,
          vx:rnd(-.1,.1),vy:rnd(-.25,-.05),life:rnd(2,4),max:4,size:rnd(.8,1.8),ember:false});
      }
    }
    for(let i=motes.length-1;i>=0;i--){
      const mo=motes[i];
      mo.x+=mo.vx*.016; mo.y+=mo.vy*.016; mo.life-=.016;
      if(mo.life<=0)motes.splice(i,1);
    }
  }
  draw();
  requestAnimationFrame(loop);
}

showTitle();
requestAnimationFrame(loop);
