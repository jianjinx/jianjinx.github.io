<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xingxw 的小窝</title>
<meta name="description" content="xingxw 的个人主页 — 一个安静的小角落。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@200;300;400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== Reset ===== */
*, *::before, *::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* ===== Variables ===== */
:root {
  --bg: #ffffff;
  --fg: #111111;
  --muted: #999999;
  --light: #cccccc;
  --line: #eeeeee;
  --dark-bg: #0a0a0a;
  --dark-fg: #f5f5f5;
  --dark-muted: #666666;
  --max-width: 1100px;
  --padding: 8vw;
}

/* ===== Base ===== */
html {
  scroll-behavior: smooth;
  font-size: 16px;
}

body {
  background: var(--bg);
  color: var(--fg);
  font-family: 'Noto Sans SC', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  font-weight: 300;
  line-height: 1.8;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* ===== Reduced Motion ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ===== Focus ===== */
a:focus-visible {
  outline: 2px solid var(--fg);
  outline-offset: 4px;
}
.dark-break a:focus-visible {
  outline-color: var(--dark-fg);
}

/* ===== Section scroll margin ===== */
section {
  scroll-margin-top: 2rem;
}

/* ===== Hero ===== */
#hero {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 var(--padding);
  position: relative;
}

.hero-title {
  font-size: clamp(3rem, 13vw, 11rem);
  line-height: 0.95;
  letter-spacing: -0.04em;
  margin-bottom: 2.5rem;
}

.hero-title .name {
  display: block;
  font-weight: 700;
}

.hero-title .nest {
  display: block;
  font-weight: 200;
  color: var(--muted);
}

.hero-tagline {
  font-size: clamp(0.9rem, 1.1vw, 1rem);
  color: var(--muted);
  font-weight: 300;
  letter-spacing: 0.03em;
  max-width: 28em;
  line-height: 1.7;
}

.hero-meta {
  position: absolute;
  bottom: 4rem;
  left: var(--padding);
  right: var(--padding);
  display: flex;
  justify-content: space-between;
  font-size: 0.75rem;
  color: var(--light);
  letter-spacing: 0.15em;
  text-transform: uppercase;
  font-weight: 400;
}

.scroll-hint {
  position: absolute;
  bottom: 2rem;
  left: 50%;
  transform: translateX(-50%);
  width: 1px;
  height: 40px;
  background: var(--line);
  overflow: hidden;
}

.scroll-hint::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 50%;
  background: var(--fg);
  animation: scrollDown 2.4s ease-in-out infinite;
}

@keyframes scrollDown {
  0% { transform: translateY(-100%); }
  50% { transform: translateY(100%); }
  100% { transform: translateY(100%); }
}

/* ===== Entrance Animation ===== */
.fade-in {
  opacity: 0;
  transform: translateY(24px);
  animation: fadeInUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.delay-1 { animation-delay: 0.2s; }
.delay-2 { animation-delay: 0.45s; }
.delay-3 { animation-delay: 0.7s; }

@keyframes fadeInUp {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ===== About ===== */
#about {
  padding: 10rem var(--padding);
  max-width: var(--max-width);
}

.section-label {
  font-size: 0.75rem;
  color: var(--muted);
  letter-spacing: 0.25em;
  text-transform: uppercase;
  margin-bottom: 3rem;
  font-weight: 400;
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 2.2fr;
  gap: 4rem;
  align-items: start;
}

.about-text {
  font-size: clamp(1.2rem, 1.8vw, 1.6rem);
  font-weight: 300;
  line-height: 1.7;
  letter-spacing: 0.01em;
}

.about-text p {
  margin-bottom: 1.5rem;
}

.about-text .secondary {
  color: var(--muted);
  font-size: 0.9em;
}

/* ===== Dark Break ===== */
.dark-break {
  background: var(--dark-bg);
  color: var(--dark-fg);
  padding: 9rem var(--padding);
  text-align: center;
}

.statement {
  font-size: clamp(1.5rem, 3.8vw, 3.2rem);
  font-weight: 200;
  line-height: 1.5;
  letter-spacing: 0.03em;
  max-width: 18em;
  margin: 0 auto;
}

.statement .em {
  font-weight: 500;
}

.statement-source {
  margin-top: 2rem;
  font-size: 0.8rem;
  color: var(--dark-muted);
  letter-spacing: 0.15em;
  font-weight: 300;
}

/* ===== Interests ===== */
#interests {
  padding: 10rem var(--padding);
  max-width: var(--max-width);
}

.interests-list {
  list-style: none;
}

.interest-item {
  display: grid;
  grid-template-columns: 60px 1fr 2fr;
  gap: 2rem;
  padding: 2rem 0;
  border-top: 1px solid var(--line);
  align-items: baseline;
  transition: padding-left 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

.interest-item:last-child {
  border-bottom: 1px solid var(--line);
}

.interest-item:hover {
  padding-left: 1.5rem;
}

.interest-num {
  font-size: 0.8rem;
  color: var(--light);
  font-weight: 400;
  letter-spacing: 0.1em;
}

.interest-name {
  font-size: clamp(1.2rem, 2.2vw, 1.75rem);
  font-weight: 500;
  letter-spacing: -0.01em;
}

.interest-desc {
  font-size: 0.95rem;
  color: var(--muted);
  font-weight: 300;
  line-height: 1.6;
}

/* ===== Contact ===== */
#contact {
  padding: 10rem var(--padding) 8rem;
  max-width: var(--max-width);
}

.contact-email {
  font-size: clamp(1.5rem, 3.5vw, 2.8rem);
  font-weight: 300;
  margin-bottom: 3rem;
  line-height: 1.3;
}

.contact-email a {
  color: var(--fg);
  text-decoration: none;
  border-bottom: 1px solid var(--line);
  padding-bottom: 0.3rem;
  transition: border-color 0.3s ease;
}

.contact-email a:hover {
  border-bottom-color: var(--fg);
}

.contact-links {
  display: flex;
  gap: 2.5rem;
  flex-wrap: wrap;
}

.contact-links a {
  color: var(--muted);
  text-decoration: none;
  font-size: 0.875rem;
  letter-spacing: 0.05em;
  transition: color 0.3s ease;
}

.contact-links a:hover {
  color: var(--fg);
}

/* ===== Footer ===== */
footer {
  padding: 3rem var(--padding);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 0.75rem;
  color: var(--light);
  letter-spacing: 0.05em;
}

footer a {
  color: var(--light);
  text-decoration: none;
  transition: color 0.3s ease;
}

footer a:hover {
  color: var(--muted);
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  :root {
    --padding: 6vw;
  }

  #about, #interests, #contact {
    padding: 6rem var(--padding);
  }

  .dark-break {
    padding: 6rem var(--padding);
  }

  .about-grid {
    grid-template-columns: 1fr;
    gap: 2rem;
  }

  .interest-item {
    grid-template-columns: 36px 1fr;
    gap: 1rem;
    padding: 1.5rem 0;
  }

  .interest-item:hover {
    padding-left: 0.5rem;
  }

  .interest-desc {
    grid-column: 2 / -1;
    margin-top: 0.4rem;
  }

  .hero-meta {
    flex-direction: column;
    gap: 0.5rem;
    bottom: 3rem;
  }

  .contact-links {
    gap: 1.5rem;
  }

  footer {
    flex-direction: column;
    gap: 1rem;
    text-align: center;
  }
}
</style>
</head>
<body>

<!-- ===== Hero ===== -->
<section id="hero" data-section="hero">
  <h1 class="hero-title">
    <span class="name fade-in">xingxw</span>

  <p class="hero-tagline fade-in delay-2">

</body>
</html>
